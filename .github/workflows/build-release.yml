name: Build & Release (Android APK + Desktop)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه (مثلاً v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # آماده‌سازی فایل تک‌صفحه‌ای مشترک
  # ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install pillow

      - name: Build single-file offline app
        run: python build_single.py

      - name: Upload shared asset
        uses: actions/upload-artifact@v4
        with:
          name: offline-html
          path: |
            bme-konkur-offline.html
            android/app/src/main/assets/index.html
            desktop_app/web/index.html
          retention-days: 5

  # ─────────────────────────────────────────────
  # اندروید — APK واقعی و کامل (۱۰۰٪ آفلاین)
  # ─────────────────────────────────────────────
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pillow
      - name: Rebuild assets
        run: python build_single.py

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate release keystore
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias bmekonkur \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass bmekonkur123 -keypass bmekonkur123 \
            -dname "CN=BME Konkur, OU=App, O=BME, L=Tehran, S=Tehran, C=IR"

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: bmekonkur123
          KEY_ALIAS: bmekonkur
          KEY_PASSWORD: bmekonkur123
        run: gradle assembleRelease --no-daemon

      - name: Build Debug APK (نصب سریع بدون امضا)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/BME-Konkur-v1.0.0-unsigned-check.apk 2>/dev/null || true
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: Sign release APK (apksigner)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | head -1)
          APK=$(ls out/*release*.apk | head -1)
          $BT/apksigner sign --ks android/release.keystore --ks-pass pass:bmekonkur123 \
            --key-pass pass:bmekonkur123 --ks-key-alias bmekonkur --out out/BME-Konkur-Android-v1.0.0.apk "$APK"
          $BT/apksigner verify --print-certs out/BME-Konkur-Android-v1.0.0.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/BME-Konkur-Android-v1.0.0.apk

  # ─────────────────────────────────────────────
  # ویندوز — فایل اجرایی کامل (exe)
  # ─────────────────────────────────────────────
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pillow pyinstaller

      - name: Build single-file offline app
        run: python build_single.py

      - name: Build EXE with PyInstaller
        working-directory: desktop_app
        run: |
          pyinstaller --noconfirm --clean --windowed --name "BME-Konkur" ^
            --add-data "web;web" ^
            --hidden-import webview.platforms.edgechromium ^
            --hidden-import webview.platforms.winforms ^
            --hidden-import clr ^
            app.py

      - name: Create installer ZIP
        working-directory: desktop_app
        run: |
          Compress-Archive -Path "dist/BME-Konkur/*" -DestinationPath "dist/BME-Konkur-Windows-v1.0.0.zip" -Force

      - name: Also build single-file EXE
        working-directory: desktop_app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "BME-Konkur-Portable" ^
            --add-data "web;web" ^
            --hidden-import webview.platforms.edgechromium ^
            --hidden-import webview.platforms.winforms ^
            --hidden-import clr ^
            app.py
          Copy-Item "dist/BME-Konkur-Portable.exe" "dist/BME-Konkur-Portable-Windows-v1.0.0.exe" -Force

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            desktop_app/dist/BME-Konkur-Windows-v1.0.0.zip
            desktop_app/dist/BME-Konkur-Portable-Windows-v1.0.0.exe

  # ─────────────────────────────────────────────
  # لینوکس
  # ─────────────────────────────────────────────
  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          pip install pywebview pillow pyinstaller

      - name: Build single-file offline app
        run: python build_single.py

      - name: Build binary
        working-directory: desktop_app
        run: |
          pyinstaller --noconfirm --clean --windowed --name "BME-Konkur" \
            --add-data "web:web" \
            --hidden-import webview.platforms.gtk \
            app.py

      - name: Package
        working-directory: desktop_app
        run: |
          cd dist && zip -r "../BME-Konkur-Linux-v1.0.0.zip" "BME-Konkur"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: desktop_app/BME-Konkur-Linux-v1.0.0.zip

  # ─────────────────────────────────────────────
  # انتشار ریلیز
  # ─────────────────────────────────────────────
  release:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} release/ \;
          cd release && ls -la
          # نسخه تک‌فایلی آفلاین هم ضمیمه شود
          cp ../bme-konkur-offline.html ./BME-Konkur-Offline-SingleFile.html 2>/dev/null || true

      - name: Get version tag
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "کنکور ارشد مهندسی پزشکی — نسخه ${{ steps.ver.outputs.tag }}"
          body: |
            # 🩺📚 اپلیکیشن آمادگی کنکور ارشد مهندسی پزشکی

            نسخه کامل و **کاملاً آفلاین** — همه محتوا، فونت و موتورها از قبل داخل فایل نصبی قرار دارند.
            **هیچ نیازی به اینترنت، سرور یا نصب اضافه نیست.**

            ---

            ## 📱 اندروید
            **`BME-Konkur-Android-v1.0.0.apk`**
            1. فایل APK را روی گوشی کپی کن
            2. از تنظیمات، «نصب از منابع نامشخص» را برای فایل‌منیجر فعال کن
            3. روی APK بزن و نصب کن ✅
            - اپ کامل آفلاین کار می‌کند (بدون اینترنت)
            - پیشرفت به صورت خودکار ذخیره می‌شود

            ## 💻 ویندوز
            **`BME-Konkur-Portable-Windows-v1.0.0.exe`** ← تک‌فایل، بدون نصب (پیشنهادی)
            **`BME-Konkur-Windows-v1.0.0.zip`** ← پوشه کامل برنامه
            1. فایل را دانلود کن
            2. دابل‌کلیک کن — تمام! 🎉
            - WebView2 در ویندوز ۱۰/۱۱ از قبل نصب است
            - نیازی به پایتون یا هیچ چیز دیگری نیست

            ## 🐧 لینوکس
            **`BME-Konkur-Linux-v1.0.0.zip`** — از حالت فشرده خارج کن و `BME-Konkur` را اجرا کن

            ## 🌐 نسخه تک‌فایل
            **`BME-Konkur-Offline-SingleFile.html`** — فقط دابل‌کلیک کن! روی هر دستگاهی (گوشی/تبلت/کامپیوتر) در هر مرورگری باز می‌شود، کاملاً آفلاین.

            ---

            ## 📚 محتوای اپ
            | بخش | توضیح |
            |---|---|
            | 🎒 دوره پایه تا پیشرفته | آموزش از صفرِ صفر با زبان ساده و مثال |
            | 📚 درس‌نامه | ۱۰ درس، ۴۱ درس‌نامه دانشگاهی |
            | 📝 بانک سوال | ۹۷ تست کنکوری با دو توضیح (ترفند کنکوری + حل کامل) |
            | ✏️ سوالات تمرینی تالیفی | ۴۷ سوال تمرینی برای تسلط |
            | 🎓 آزمون‌های ۱۰ ساله | ۱۰ آزمون، هر کدام ۲۵ سوال |
            | 🧑‍🏫 استاد | تدریس فعال و پرسش‌پاسخ |
            | 🔗 کتاب‌های رایگان | لینک منابع معتبر |
            | 💾 ذخیره‌سازی | نشان‌گذاری، مرور، پشتیبان‌گیری |

            **۱۰ درس:** ریاضی، مدار، سیگنال، الکترونیک، فیزیک، الکترومغناطیس، کنترل، پزشکی، بیومکانیک، کامپیوتر

            ---
            ⚕️ *ساخته شده برای استفاده شخصی و مطالعه.*
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
