name: Build & Release (Android APK + Desktop)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: v1.0.0

jobs:
  # ─────────────────────────────────────────────
  # 📱 اندروید — APK واقعی و کامل (۱۰۰٪ آفلاین)
  # ─────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install pillow

      - name: Build single-file offline app (assets)
        run: python build_single.py

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK (pre-installed on runner)
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          CT=$(ls -d $ANDROID_HOME/cmdline-tools/* 2>/dev/null | head -1)
          [ -n "$CT" ] && echo "$CT/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | head -1)
          [ -n "$BT" ] && echo "$BT" >> $GITHUB_PATH
          echo "--- SDK contents ---"
          ls "$ANDROID_HOME" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true

      - name: Accept licenses & ensure packages
        run: |
          CT=$(ls -d $ANDROID_HOME/cmdline-tools/* 2>/dev/null | head -1)
          yes | "$CT/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CT/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -3 || true
          echo "platforms:"; ls "$ANDROID_HOME/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate release keystore
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias bmekonkur \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass bmekonkur123 -keypass bmekonkur123 \
            -dname "CN=BME Konkur, OU=App, O=BME, L=Tehran, S=Tehran, C=IR"

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: bmekonkur123
          KEY_ALIAS: bmekonkur
          KEY_PASSWORD: bmekonkur123
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK (نصب سریع)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Collect & rename APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/BME-Konkur-Android-v1.0.0.apk" 2>/dev/null || \
          cp android/app/build/outputs/apk/release/*.apk "out/BME-Konkur-Android-v1.0.0.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/BME-Konkur-Android-Debug-v1.0.0.apk" 2>/dev/null || true
          ls -la out/
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs "out/BME-Konkur-Android-v1.0.0.apk" | head -4 || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  # 💻 ویندوز — فایل اجرایی کامل (exe)
  # ─────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pillow pyinstaller

      - name: Build single-file offline app
        run: python build_single.py

      - name: Build EXE (folder version)
        working-directory: desktop_app
        run: pyinstaller --noconfirm --clean --windowed --name BME-Konkur --add-data "web;web" --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms --hidden-import clr app.py

      - name: Build EXE (portable single file)
        working-directory: desktop_app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BME-Konkur-Portable --add-data "web;web" --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms --hidden-import clr app.py

      - name: Package for release
        working-directory: desktop_app
        run: |
          Compress-Archive -Path "dist/BME-Konkur/*" -DestinationPath "dist/BME-Konkur-Windows-v1.0.0.zip" -Force
          Copy-Item "dist/BME-Konkur-Portable.exe" "dist/BME-Konkur-Portable-Windows-v1.0.0.exe" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            desktop_app/dist/BME-Konkur-Windows-v1.0.0.zip
            desktop_app/dist/BME-Konkur-Portable-Windows-v1.0.0.exe
          retention-days: 30

  # ─────────────────────────────────────────────
  # 🐧 لینوکس
  # ─────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GTK/WebKit + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 zip
          pip install pywebview pillow pyinstaller

      - name: Build single-file offline app
        run: python build_single.py

      - name: Build Linux binary
        working-directory: desktop_app
        run: pyinstaller --noconfirm --clean --windowed --name BME-Konkur --add-data "web:web" --hidden-import webview.platforms.gtk app.py

      - name: Package
        working-directory: desktop_app
        run: cd dist && zip -r "../BME-Konkur-Linux-v1.0.0.zip" "BME-Konkur"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: desktop_app/BME-Konkur-Linux-v1.0.0.zip
          retention-days: 30

  # ─────────────────────────────────────────────
  # 🌐 فایل تک‌صفحه‌ای آفلاین (برای هر دستگاهی)
  # ─────────────────────────────────────────────
  singlefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Build
        run: |
          python build_single.py
          cp bme-konkur-offline.html BME-Konkur-Offline-SingleFile.html
          ls -la BME-Konkur-Offline-SingleFile.html
      - uses: actions/upload-artifact@v4
        with:
          name: singlefile
          path: BME-Konkur-Offline-SingleFile.html
          retention-days: 30

  # ─────────────────────────────────────────────
  # 🚀 انتشار ریلیز
  # ─────────────────────────────────────────────
  release:
    needs: [android, windows, linux, singlefile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" -o -name "*.html" \) -exec cp {} release/ \;
          ls -la release/

      - name: Get version tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "کنکور ارشد مهندسی پزشکی — نسخه ${{ steps.ver.outputs.tag }}"
          body: |
            # 🩺📚 اپلیکیشن کامل آمادگی کنکور ارشد مهندسی پزشکی

            نسخه **کاملاً آفلاین** — تمام محتوا، فونت فارسی و موتور نمایش از قبل داخل فایل نصبی قرار دارند.
            **هیچ نیازی به اینترنت، سرور، پایتون یا نصب اضافه نیست.**

            ---

            ## 📱 اندروید — `BME-Konkur-Android-v1.0.0.apk`
            1. فایل APK را روی گوشی کپی کن
            2. اگر خواست، «نصب از منابع نامشخص» را برای مرورگر/فایل‌منیجر فعال کن
            3. روی فایل بزن ← نصب ← تمام ✅

            *کار می‌کند روی اندروید ۵ (API 21) و بالاتر — بدون اینترنت*

            ## 💻 ویندوز
            | فایل | توضیح |
            |---|---|
            | **`BME-Konkur-Portable-Windows-v1.0.0.exe`** | 🏆 تک‌فایل — دابل‌کلیک کن، بدون نصب |
            | `BME-Konkur-Windows-v1.0.0.zip` | پوشه کامل — بعد از استخراج `BME-Konkur.exe` را اجرا کن |

            *بدون نیاز به پایتون — WebView2 در ویندوز ۱۰/۱۱ از قبل موجود است*

            ## 🐧 لینوکس — `BME-Konkur-Linux-v1.0.0.zip`
            استخراج کن و فایل `BME-Konkur` را اجرا کن (نیاز به `gir1.2-webkit2-4.1`)

            ## 🌐 هر دستگاهی — `BME-Konkur-Offline-SingleFile.html`
            فقط دابل‌کلیک کن! روی گوشی، تبلت و کامپیوتر در هر مرورگری باز می‌شود — کاملاً آفلاین.
            برای موبایل: می‌توانی آن را «افزودن به صفحه اصلی» کنی و مثل اپ استفاده کنی.

            ---

            ## 📚 محتوای اپ

            | بخش | توضیح |
            |---|---|
            | 🎒 **دوره پایه تا پیشرفته** | آموزش از صفرِ صفر به زبان ساده با مثال و تشبیه — ۳ سطح برای هر درس |
            | 📚 **درس‌نامه** | ۱۰ درس، ۴۱ درس‌نامه دانشگاهی |
            | 📝 **بانک سوال** | ۹۷ تست کنکوری با **دو توضیح** (ترفند کنکوری ⚡ + حل کامل 📖) |
            | ✏️ **سوالات تمرینی تالیفی** | ۴۷ سوال برای تسلط، با کادر آموزش قبل از پاسخ |
            | 🎓 **آزمون‌های ۱۰ ساله** | ۱۰ آزمون (۱۳۹۴–۱۴۰۳)، هر کدام ۲۵ سوال با تایمر و کارنامه |
            | 🧑‍🏫 **استاد** | تدریس فعال، پرسش و اصلاح اشتباه |
            | 🔗 **کتاب‌های رایگان** | لینک منابع معتبر دانشگاهی |
            | 💾 **مدیریت پیشرفت** | نشان‌گذاری، ذخیره سوال، پشتیبان‌گیری، تم تاریک/روشن |

            **۱۰ درس:** ریاضی مهندسی • مدار الکتریکی • سیگنال و سیستم • الکترونیک • فیزیک • الکترومغناطیس • کنترل • فیزیولوژی پزشکی • بیومکانیک • برنامه‌نویسی

            ---
            ⚕️ *ساخته شده برای مطالعه شخصی — موفق باشی در کنکور!*
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
