:root{
  --bg:#0b1120; --bg2:#0f172a; --card:#1e293b; --card2:#273449; --hover:#334155;
  --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#38bdf8; --accent2:#a78bfa;
  --success:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --shadow: 0 8px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);direction:rtl;}
body{overflow:hidden;}
#app{display:grid;grid-template-columns:260px 1fr;height:100vh;}

/* sidebar */
.sidebar{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:20px 16px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 20px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.logo{font-size:40px;}
.brand-title{font-weight:800;font-size:18px;line-height:1.4;color:var(--accent);}
.brand-title span{font-size:12px;font-weight:500;color:var(--muted);}
nav{display:flex;flex-direction:column;gap:6px;flex:1;}
.nav-btn{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;padding:12px 14px;border-radius:10px;text-align:right;display:flex;align-items:center;gap:10px;transition:all .2s;}
.nav-btn span{font-size:18px;margin-right:auto;}
.nav-btn:hover{background:var(--hover);}
.nav-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0f172a;font-weight:700;}
.sidebar-stat{background:var(--card);border-radius:12px;padding:14px;margin-top:10px;}
.stat-title{font-weight:700;font-size:14px;margin-bottom:6px;}

/* main */
main{overflow-y:auto;padding:30px 40px;}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:30px;font-weight:800;}
.page-head p{color:var(--muted);margin-top:6px;font-size:14px;}

/* grid cards */
.grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0;}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);border:1px solid transparent;transition:all .25s;}
.card.clickable{cursor:pointer;}
.card.clickable:hover{transform:translateY(-4px);border-color:var(--accent);}
.card .emoji{font-size:42px;}
.card h3{margin-top:8px;font-size:16px;font-weight:700;min-height:48px;line-height:1.4;}
.card p{color:var(--muted);font-size:12px;margin:8px 0;}
.card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

/* buttons */
.btn{border:none;font-family:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;transition:transform .1s, filter .2s;}
.btn:hover{filter:brightness(1.1);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#0f172a;}
.btn-secondary{background:var(--accent2);color:#fff;}
.btn-ghost{background:var(--hover);color:var(--text);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}

/* stat rows */
.big-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 24px;}
.big-stat{background:var(--card);border-radius:14px;padding:22px;text-align:center;}
.big-stat .num{font-size:36px;font-weight:800;}
.big-stat .lbl{color:var(--muted);font-size:12px;margin-top:4px;}

/* sections */
.section-title{font-size:18px;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px;}

/* lesson card */
.lesson{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;}
.lesson-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.lesson-num{background:var(--accent);color:#0f172a;font-weight:800;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lesson-title{font-weight:700;font-size:16px;flex:1;}
.lesson-content{background:#0f172a;border-radius:10px;padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:2;color:var(--text);text-align:justify;max-height:380px;overflow-y:auto;}
.lesson-foot{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
.badge{background:var(--success);color:#fff;font-size:11px;padding:3px 8px;border-radius:14px;}

/* quiz */
.quiz-wrap{max-width:900px;margin:0 auto;}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;font-weight:600;}
.progress{height:10px;background:var(--card);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.q-card{background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--shadow);}
.q-text{font-size:18px;font-weight:700;line-height:1.7;margin-bottom:20px;}
.choice{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--bg2);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;}
.choice:hover{background:var(--hover);}
.choice.selected{border-color:var(--accent);background:rgba(56,189,248,.12);}
.choice.correct{border-color:var(--success);background:rgba(34,197,94,.18);}
.choice.wrong{border-color:var(--danger);background:rgba(239,68,68,.18);}
.choice .letter{font-weight:800;background:var(--card2);padding:4px 10px;border-radius:8px;flex-shrink:0;}
.explain{margin-top:14px;padding:14px;background:rgba(245,158,11,.14);border-right:4px solid var(--warning);border-radius:8px;font-size:13px;line-height:1.9;}
.q-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;}

/* exam nav grid */
.q-nav{background:var(--card);padding:10px;border-radius:10px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;max-height:80px;overflow-y:auto;}
.q-nav button{width:38px;height:38px;border-radius:50%;border:none;background:var(--hover);color:var(--text);font-weight:700;cursor:pointer;font-family:inherit;}
.q-nav button.active{background:var(--accent2);color:#fff;}
.q-nav button.answered{background:var(--success);color:#fff;}
.timer{font-weight:800;color:var(--warning);font-size:16px;}

/* result */
.result{background:var(--card);border-radius:16px;padding:30px;text-align:center;margin-bottom:20px;}
.result .score{font-size:56px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.result .msg{margin-top:8px;color:var(--muted);}
.q-result{background:var(--card);border-radius:12px;padding:14px;margin-bottom:8px;}
.q-result .mark{font-weight:700;margin-left:8px;}
.q-result.ok{border-right:4px solid var(--success);}
.q-result.bad{border-right:4px solid var(--danger);}
.q-result p{font-size:14px;line-height:1.9;margin-top:6px;}
.q-result .ans-line{font-size:12px;color:var(--muted);margin-top:6px;}

/* subject color dots */
.sub-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle;}

/* book card */
.book{background:var(--card);border-radius:12px;padding:16px;margin-bottom:10px;}
.book h3{color:var(--accent);font-size:15px;margin-bottom:4px;}
.book .author{color:var(--muted);font-size:12px;}
.book .desc{margin-top:8px;font-size:13px;line-height:1.9;color:#cbd5e1;}
.book .topic{background:var(--accent2);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:6px;}

/* form */
.segments{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:10px;width:fit-content;margin:6px 0 20px;}
.segments button{background:transparent;border:none;color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;}
.segments button.on{background:var(--accent);color:#0f172a;}
label{display:block;margin-top:10px;font-size:13px;color:var(--muted);}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--hover);}

/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.fade{animation:fadeUp .3s ease-out;}

/* fix for bottom nav safe area (iPhone) */
@supports (padding-bottom: env(safe-area-inset-bottom)){
  .sidebar{padding-bottom: env(safe-area-inset-bottom);}
}
body.pwa-installed{padding-bottom:env(safe-area-inset-bottom);}
.install-banner{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:12px 16px;border-radius:12px;color:#0f172a;margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.install-banner button{background:#0f172a;color:white;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600}

@media (max-width: 960px){
  /* سایدبار در موبایل به پایین صفحه منتقل می‌شود (position:fixed)
     پس دیگر نباید هیچ ستونی در گرید اشغال کند => تک‌ستونه */
  #app{grid-template-columns:1fr;height:100dvh;}
  main{height:100dvh;padding:12px 12px 84px 12px;-webkit-overflow-scrolling:touch;}
  .brand-title, .nav-btn span + span, .sidebar-stat{display:none;}
  .nav-btn{justify-content:center;padding:12px 8px;}
  .nav-btn span{margin:0;font-size:20px;}
  .brand{justify-content:center;padding:10px 0;}
  .logo{font-size:28px;}
  .grid-cards{grid-template-columns:1fr 1fr;gap:10px;}
  .big-stats{grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .big-stat{padding:12px 6px;}
  .big-stat .num{font-size:24px;}
  .card{padding:14px;border-radius:12px;}
  .card .emoji{font-size:30px;}
  .card h3{font-size:13px;min-height:auto;margin-top:6px;}
  .btn{padding:10px 12px;font-size:12px;}
  .card-actions{gap:6px;margin-top:10px;}
  .btn-sm{padding:6px 8px;font-size:11px;}
  .page-head h1{font-size:22px;}
  .page-head p{font-size:12px;line-height:1.8;}
  .q-text{font-size:15px;}
  .choice{padding:12px;font-size:13px;}
  .q-card{padding:16px;}
  .quiz-wrap{padding:0;}
  .lesson-content{max-height:280px;font-size:12px;}
  /* bottom nav for mobile */
  .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;z-index:100;flex-direction:row;border-left:none;border-top:1px solid var(--border);padding:4px 2px;}
  .brand{display:none;}
  nav{flex-direction:row;justify-content:space-around;width:100%;gap:2px;padding:0;}
  .nav-btn{width:40px;height:50px;border-radius:10px;padding:0;display:flex;align-items:center;justify-content:center;font-size:10px;flex-direction:column;line-height:1;}
  .nav-btn span{display:block;font-size:18px;margin:0 0 2px 0;}
  .nav-btn span + span{display:block;font-size:8px;color:var(--muted);font-weight:500;font-family:inherit;}
  .sidebar-stat{display:none;}
  /* touch targets larger */
  .choice{margin-bottom:8px;min-height:48px;}
  .btn{min-height:42px;}
}
@media (max-width:600px){
  .grid-cards{grid-template-columns:1fr;}
  .big-stats{grid-template-columns:1fr 1fr 1fr;}
  .page-head h1{font-size:20px;}
  .q-nav{max-width:100%;}
  .q-nav button{width:34px;height:34px;font-size:12px;}
  .q-actions{flex-direction:column;gap:8px;}
  .q-actions > div{justify-content:space-between;}
}
@media (min-width:961px){
  .nav-btn span + span{display:inline;}
}

/* toast notification */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:12px 22px;border-radius:12px;font-family:inherit;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .3s ease;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:961px){#toast{bottom:32px}}

<script>const APP_DATA = {"subjects": [{"id": "math", "name": "ریاضیات (معادلات دیفرانسیل، آمار و احتمال، ریاضیات مهندسی)", "emoji": "📐", "color": "#3b82f6", "lessons": [{"title": "معادلات دیفرانسیل مرتبه اول", "content": "🔹 معادلات دیفرانسیل جداشدنی: dy/dx = f(x)g(y) → ∫ dy/g(y) = ∫ f(x)dx\n🔹 معادلات همگن: با تبدیل v = y/x به معادله جداشدنی تبدیل می‌شوند\n🔹 معادلات خطی مرتبه اول: dy/dx + P(x)y = Q(x)\n   عامل انتگرال‌ساز: μ(x) = exp(∫ P(x)dx)\n   جواب: y = (1/μ)(∫ μQ dx + C)\n🔹 معادلات برنولی: dy/dx + P(x)y = Q(x)yⁿ (با تبدیل v = y^(1-n) خطی می‌شود)\n🔹 معادلات کامل: Mdx + Ndy = 0 وقتی ∂M/∂y = ∂N/∂x\n\n🔰 نکات کنکوری:\n• در سؤالات معادلات برنولی، به توان n دقت کنید (n≠0,1)\n• عامل انتگرال‌ساز برای معادلاتی که ∂M/∂y - ∂N/∂x تابعی از x یا y باشد، فرم خاص دارد\n• جواب عمومی معادله خطی شامل یک ثابت دلخواه است"}, {"title": "معادلات دیفرانسیل مرتبه بالاتر", "content": "🔹 معادلات خطی همگن ضرایب ثابت مرتبه n:\n   a_n y^(n) + ... + a₁ y' + a₀ y = 0\n   معادله مشخصه: a_n rⁿ + ... + a₁ r + a₀ = 0\n   • ریشه حقیقی متمایز r: Ce^(rx)\n   • ریشه تکراری مرتبه m: (C₁ + C₂x + ... + Cₘx^(m-1))e^(rx)\n   • ریشه مختلط α±βi: e^(αx)(C₁cosβx + C₂sinβx)\n\n🔹 روش ضرایب نامعین (برای معادلات ناهمگن):\n   برای سمت راست شامل e^(ax)، xⁿ، sin/cos، حدس متناسب بزنید\n🔹 روش تغییر پارامترها (لاگرانژ): y_p = u₁y₁ + u₂y₂\n🔹 تبدیل لاپلاس: برای حل معادلات با شرایط اولیه\n   L{y'} = sY(s) - y(0)\n   L{y''} = s²Y(s) - s·y(0) - y'(0)\n\n🔰 نکات کنکوری:\n• جمع ضرایب معادله مشخصه صفر باشد → r=1 یک ریشه است\n• اگر ضریب ثابت صفر باشد → r=0 یک ریشه است\n• تبدیل لاپلاس برای توابع تکه‌ای (با تابع پله هویساید) بسیار مناسب است"}, {"title": "آمار و احتمال", "content": "🔹 اصول شمارش: جایگشت P(n,r) = n!/(n-r)! ، ترکیب C(n,r) = n!/(r!(n-r)!)\n🔹 احتمال شرطی: P(A|B) = P(A∩B)/P(B)\n🔹 قضیه بیز: P(B|A) = P(A|B)P(B)/P(A)\n🔹 متغیر تصادفی و توزیع‌ها:\n   • یکنواخت پیوسته U(a,b): E(X)=(a+b)/2 , Var=(b-a)²/12\n   • نرمال N(μ,σ²): E=μ , Var=σ²\n   • نمایی (با پارامتر λ): E=1/λ , Var=1/λ²، خاصیت بی‌حافظگی\n   • پواسون: P(X=k)=e^(-λ)λᵏ/k! ، E=Var=λ\n   • دوجمله‌ای: E=np , Var=np(1-p)\n\n🔹 توزیع‌های نمونه‌گیری، فاصله اطمینان، آزمون فرض\n🔹 رگرسیون خطی ساده: y = ax+b، روش حداقل مربعات\n\n🔰 نکات کنکوری:\n• قضیه بیز را با درخت احتمال حل کنید\n• توزیع پواسون برای پیشامدهای نادر (خطاهای پزشکی، تعداد بیماران) کاربرد دارد\n• در توزیع نمایی، P(X>t+s|X>s)=P(X>t) (بی‌حافظگی)"}, {"title": "ریاضیات مهندسی - سری و انتگرال فوریه", "content": "🔹 سری فوریه تابع تناوبی با دوره T=2L:\n   f(x) = a₀/2 + Σ [aₙcos(nπx/L) + bₙsin(nπx/L)]\n   a₀ = (1/L)∫_{-L}^{L} f(x)dx\n   aₙ = (1/L)∫_{-L}^{L} f(x)cos(nπx/L)dx\n   bₙ = (1/L)∫_{-L}^{L} f(x)sin(nπx/L)dx\n\n🔹 توابع زوج: bₙ=0 ، فقط کسینوس\n🔹 توابع فرد: a₀=aₙ=0 ، فقط سینوس\n🔹 انتگرال فوریه، تبدیل فوریه:\n   F(ω) = ∫_{-∞}^{∞} f(x)e^(-iωx) dx\n🔹 خواص تبدیل فوریه: خطی، شیفت زمانی، شیفت فرکانس، مدولاسیون، مشتق‌گیری\n\n🔰 نکات کنکوری:\n• برای پیدا کردن سری فوریه، زوج/فرد بودن تابع را ابتدا بررسی کنید\n• پدیده گیبس در نقاط ناپیوستگی\n• فیلترها در پردازش سیگنال پزشکی (ECG, EEG) بر اساس فوریه کار می‌کنند"}, {"title": "توابع مختلط و انتگرال‌گیری روی منحنی", "content": "🔹 اعداد مختلط: z = x+iy = re^(iθ) = r(cosθ+isinθ)\n🔹 فرمول اویلر: e^(iθ) = cosθ + isinθ\n🔹 توابع تحلیلی: شرایط کوشی-ریمان:\n   ∂u/∂x = ∂v/∂y , ∂u/∂y = -∂v/∂x\n🔹 انتگرال خطی، قضیه کوشی، فرمول انتگرالی کوشی\n🔹 سری تیلور و لوران\n🔹 قضیه مانده (Residue): انتگرال روی منحنی بسته = 2πi × مجموع مانده‌ها\n\n🔰 نکات کنکوری:\n• محاسبه مانده در قطب ساده: lim_{z→a} (z-a)f(z)\n• قطب مرتبه m: Res = (1/(m-1)!) lim_{z→a} d^(m-1)/dz^(m-1)[(z-a)^m f(z)]\n• کاربرد در انتگرال‌های حقیقی از نوع ∫_{-∞}^{∞} R(x)e^(iax)dx"}]}, {"id": "physics", "name": "فیزیک (الکتریسیته، مکانیک، موج و ارتعاش)", "emoji": "⚡", "color": "#8b5cf6", "lessons": [{"title": "الکتریسیته و مغناطیس پایه", "content": "🔹 قانون کولن: F = k·q₁q₂/r²\n🔹 میدان الکتریکی: E = F/q ، اختلاف پتانسیل V\n🔹 قانون گاوس: Φ_E = ∮E·dA = Q_in/ε₀\n🔹 خازن: C = Q/U ، انرژی U = (1/2)CV² = (1/2)QV\n🔹 مقاومت: R = ρL/A ، قانون اهم V=IR\n🔹 مدار RC, RL, RLC و ثابت زمانی: τ_RC=RC , τ_RL=L/R\n🔹 میدان مغناطیسی، قانون بیو-سوار، قانون آمپر\n🔹 قانون فارادی: ε = -dΦ_B/dt\n\n🔰 نکات کنکوری:\n• در مدار RC در t=0 خازن اتصال کوتاه و در t→∞ مدار باز است\n• در مدار RL در t=0 سلف مدار باز و در t→∞ اتصال کوتاه است\n• بسامد تشدید در مدار RLC سری: ω₀=1/√(LC)"}, {"title": "مکانیک - سینماتیک و دینامیک", "content": "🔹 حرکت یک‌بعدی و دوبعدی، پرتابه\n🔹 قوانین نیوتن: F=ma ، قانون سوم کنش-واکنش\n🔹 کار و انرژی: W=∫F·dr ، انرژی جنبشی K=½mv²\n🔹 انرژی پتانسیل، پایستگی انرژی مکانیکی\n🔹 تکانه خطی: p=mv ، پایستگی تکانه\n🔹 حرکت دورانی: گشتاور τ=r×F ، ممان اینرسی I\n🔹 حرکت نوسانی ساده: x=Acos(ωt+φ) ، ω=√(k/m)\n🔹 آونگ ساده: ω=√(g/L) ، T=2π√(L/g)\n\n🔰 نکات کنکوری:\n• در برخورد الاستیک: انرژی جنبشی و تکانه هر دو پایسته\n• در برخورد غیرالاستیک: فقط تکانه پایسته\n• کار کل انجام شده روی جسم = تغییر انرژی جنبشی (قضیه کار-انرژی)"}, {"title": "امواج و ارتعاشات", "content": "🔹 موج عرضی و طولی، موج سینوسی: y=Asin(kx-ωt)\n🔹 سرعت موج در طناب: v=√(T/μ)\n🔹 امواج صوتی: سرعت در هوا ~ 343 m/s\n🔹 شدت صوت (دسی‌بل): β = 10·log(I/I₀) ، I₀=10⁻¹² W/m²\n🔹 اثر دوپلر: f' = f·(v ± v_observer)/(v ∓ v_source)\n🔹 موج ایستاده، فرکانس‌های تشدید\n🔹 امواج الکترومغناطیسی: c = λf ، c=3×10⁸ m/s\n🔹 قطبش، شکست، بازتاب، تداخل و پراش\n\n🔰 نکات کنکوری:\n• در اثر دوپلر: منبع به ناظر نزدیک شود → بسامد بیشتر (صدای زیرتر)\n• در امواج ایستاده، گره‌ها در انتهای بسته و شکم‌ها در انتهای باز\n• اولتراسوند در پزشکی از امواج مکانیکی (نه EM) استفاده می‌کند"}, {"title": "فیزیک نوین و پرتوها", "content": "🔹 اثر فوتوالکتریک: K_max = hf - φ\n🔹 تابش جسم سیاه، قانون وین λ_max·T = 2.898×10⁻³ m·K\n🔹 پرتوهای یونیزان: X-ray، گاما، بتا، آلفا\n🔹 نیم‌عمر ماده رادیواکتیو: N(t)=N₀·e^(-λt) ، T½=ln2/λ\n🔹 اشعه X: از ترمزی (Bremmsstrahlung) و خطوط مشخصه\n🔹 جذب پرتو: I = I₀·e^(-μx)\n\n🔰 نکات کنکوری:\n• اشعه X از برخورد الکترون‌های پرسرعت با هدف فلزی تولید می‌شود\n• در رادیوگرافی، ضخامت نیم‌کاهنده: HVL=ln2/μ\n• پرتو آلفا کمترین و گاما بیشترین نفوذ را دارد"}]}, {"id": "circuits", "name": "مدارهای الکتریکی", "emoji": "🔌", "color": "#f59e0b", "lessons": [{"title": "تحلیل مدارهای DC", "content": "🔹 قانون اهم، قوانین کیرشهف (KCL, KVL)\n🔹 ترکیب مقاومت‌ها: سری R_eq=ΣR_i ، موازی 1/R_eq=Σ(1/R_i)\n🔹 تقسیم ولتاژ و تقسیم جریان\n🔹 تحلیل گره و مش\n🔹 قضیه تونن و نورتن:\n   • تونن: مدار معادل با V_th و R_th سری\n   • نورتن: مدار معادل با I_n و R_n موازی (R_n=R_th, I_n=V_th/R_th)\n🔹 قضیه انتقال توان ماکزیمم: R_L = R_th\n🔹 قضیه برهم‌نهی (فقط برای مدارهای خطی)\n\n🔰 نکات کنکوری:\n• منابع ولتاژ ایده‌آل اتصال کوتاه و منابع جریان ایده‌آل مدار باز برای محاسبه R_th\n• در برهم‌نهی، منابع مستقل یکی‌یکی روشن می‌شوند\n• مراقب جهت جریان در KCL باشید"}, {"title": "تحلیل مدارهای AC و سه‌فاز", "content": "🔹 امپدانس مختلط: Z_R=R, Z_L=jωL, Z_C=1/(jωC)=-j/(ωC)\n🔹 ادمیتانس Y=1/Z\n🔹 روش فازوری (Phasor)\n🔹 توان در AC: P=V_rms·I_rms·cosφ (توان حقیقی)\n   Q=V_rms·I_rms·sinφ (توان راکتیو)\n   S=P+jQ (توان مختلط)\n🔹 ضریب قدرت (Power Factor): cosφ\n🔹 مدار سه‌فاز متعادل: ستاره Y و مثلث Δ\n   • فاز-به-فاز V_L=√3·V_ph در اتصال ستاره\n   • I_L=√3·I_ph در اتصال مثلث\n\n🔰 نکات کنکوری:\n• در تشدید موازی، امپدانس بیشینه و جریان کمینه\n• اصلاح ضریب قدرت با خازن موازی\n• در اتصال ستاره بار متعادل، جریان نول صفر است"}, {"title": "پاسخ فرکانسی و فیلترها", "content": "🔹 دیاگرام بود (Bode): اندازه و فاز بر حسب فرکانس (مقیاس لگاریتمی)\n🔹 فیلتر پایین‌گذر (LPF): R-C سری، خروجی از C\n   فرکانس قطع: ω_c = 1/(RC) ، f_c = 1/(2πRC)\n🔹 فیلتر بالاگذر (HPF): خروجی از R\n🔹 فیلتر میان‌گذر (BPF) و میان‌نگذر (Notch/BSF)\n🔹 پهنای باند B = ω_h - ω_l (در -3dB)\n🔹 ضریب کیفیت Q = ω₀/B\n🔹 تابع تبدیل H(s) = V_out/V_in\n\n🔰 نکات کنکوری:\n• فیلترها در دستگاه‌های پزشکی (ECG, EEG, EMG) برای حذف نویز کاربرد دارند\n• حذف نویز 50/60Hz برق شهر با فیلتر Notch\n• مرتبه فیلتر بالاتر → تیزتر بودن شیب قطع (Butterworth, Chebyshev, Bessel)"}, {"title": "تقویت‌کننده عملیاتی (Op-Amp)", "content": "🔹 آپ‌اَمپ ایده‌آل: بهره بی‌نهایت، امپدانس ورودی بی‌نهایت، خروجی صفر\n🔹 قاعده طلایی آپ‌اَمپ: V⁺ = V⁻ (ولتاژهای ورودی برابر) و جریان ورودی صفر\n🔹 تقویت‌کننده وارون (Inverting): V_out = -(R_f/R_in)·V_in\n🔹 تقویت‌کننده ناوارون (Non-inverting): V_out = (1+R_f/R_in)·V_in\n🔹 پیرو ولتاژ (Voltage Follower): V_out = V_in (بهره=1)\n🔹 جمع‌کننده (Summing): V_out = -R_f·Σ(V_i/R_i)\n🔹 تفاضل‌گیر (Differential): V_out = (R_f/R)(V₂-V₁)\n🔹 انتگرال‌گیر و مشتق‌گیر\n\n🔰 نکات کنکوری:\n• آپ‌اَمپ در مدارهای بیوپتانسیل (ECG) کاربرد اصلی دارد\n• آپ‌اَمپ ابزار دقیق (Instrumentation Amp) برای سیگنال‌های کوچک پزشکی\n• تغذیه آپ‌اَمپ معمولاً ±15V یا ±5V"}]}, {"id": "signals", "name": "سیگنال‌ها و سیستم‌ها", "emoji": "📡", "color": "#10b981", "lessons": [{"title": "مفاهیم پایه سیگنال و سیستم", "content": "🔹 سیگنال پیوسته و گسسته، متناوب و غیرمتناوب\n🔹 سیگنال‌های پایه: ضربه (دیراک)، پله، رَمپ، سینوسی، نمایی\n🔹 خواص سیستم: خطی بودن، تغییرناپذیری زمانی، علیت، پایداری\n🔹 سیستم LTI (خطی تغییرناپذیر با زمان)\n🔹 پاسخ ضربه h(t) ، کانوالوشن: y(t) = x(t)*h(t) = ∫x(τ)h(t-τ)dτ\n🔹 پایداری BIBO: ∫|h(t)|dt < ∞\n🔹 علیت: h(t)=0 برای t<0\n\n🔰 نکات کنکوری:\n• در کانوالوشن، تاشدگی، شیفت، ضرب، انتگرال\n• سیگنال ECG, EEG, EMG همه پیوسته و پس از نمونه‌برداری گسسته می‌شوند\n• سیستم علی به ورودی‌های آینده وابسته نیست"}, {"title": "تبدیل فوریه و لاپلاس", "content": "🔹 تبدیل فوریه زمان‌پیوسته (CTFT):\n   X(ω) = ∫_{-∞}^{∞} x(t)e^(-jωt) dt\n   x(t) = (1/2π)∫X(ω)e^(jωt)dω\n🔹 خواص فوریه: خطی، شیفت زمانی e^(-jωt₀)X(ω)، شیفت فرکانس،\n   کانوالوشن → ضرب، مشتق‌گیری jωX(ω)\n🔹 طیف دامنه و فاز، پهنای باند\n🔹 تبدیل لاپلاس: X(s) = ∫_{-∞}^{∞}x(t)e^(-st)dt, s=σ+jω\n🔹 ناحیه همگرایی (ROC)\n🔹 تابع تبدیل H(s)=Y(s)/X(s)\n\n🔰 نکات کنکوری:\n• تبدیل فوریه، لاپلاس روی محور jω وقتی ROC شامل آن باشد\n• تابع تبدیل به ما پاسخ فرکانسی و پایداری می‌دهد\n• قطب‌ها در نیم‌صفحه چپ → سیستم پایدار علّی"}, {"title": "تبدیل Z و نمونه‌برداری", "content": "🔹 تبدیل Z: X(z) = Σ x[n]z⁻ⁿ\n🔹 تبدیل فوریه زمان‌گسسته (DTFT) روی دایره واحد\n🔹 قضیه نمونه‌برداری (نایکوئیست-شانن):\n   f_s ≥ 2·f_max (نرخ نمونه‌برداری حداقل دو برابر بالاترین فرکانس)\n🔹 همپاشیدگی فرکانسی (Aliasing) در صورت عدم رعایت\n🔹 کاربرد در سیگنال‌های پزشکی:\n   • ECG: 1-2 mV، BW ~ 0.05-150 Hz، fs≥500 Hz\n   • EEG: 10-100 μV، BW ~ 0.5-60 Hz\n   • EMG: BW ~ 10-5000 Hz\n\n🔰 نکات کنکوری:\n• Aliasing زمانی رخ می‌دهد که فرکانس سیگنال بالاتر از fs/2 باشد\n• فیلتر ضد-همپاشیدگی (Anti-aliasing) قبل از ADC\n• رزولوشن ADC: برای 12bit و محدوده ±5V، کوچکترین گام ≈ 2.44 mV"}, {"title": "فیلترهای دیجیتال", "content": "🔹 FIR (Finite Impulse Response):\n   • پاسخ ضربه متناهی، پایدار همیشه\n   • طراحی با روش پنجره (Window): Rectangular, Hamming, Hanning, Blackman\n   • فاز خطی با پنجره متقارن\n🔹 IIR (Infinite Impulse Response):\n   • از روی آنالوگ (Butterworth, Chebyshev, Bessel) با تبدیل‌های دوخطی/نالجایست\n   • مرتبه کمتر برای مشخصه مشابه اما غیرخطی بودن فاز\n🔹 تبدیل فوریه سریع (FFT) برای محاسبه طیف\n🔹 تبدیل موجک (Wavelet) برای تحلیل زمان-فرکانس\n\n🔰 نکات کنکوری:\n• فیلتر FIR فاز خطی → بدون اعوجاج شکل موج (مهم برای ECG)\n• در فیلتر IIR، تبدیل دوخطی دگرگونی فرکانسی دارد (prewarping)\n• موجک برای تشخیص QRS در ECG بسیار کاربرد دارد"}]}, {"id": "anatomy", "name": "آناتومی و فیزیولوژی", "emoji": "🫀", "color": "#ef4444", "lessons": [{"title": "آناتومی عمومی بدن", "content": "🔹 سه صفحه آناتومیک: ساژیتال، کرونال (فرونتال)، عرضی (ترانسورس)\n🔹 دستگاه‌های اصلی:\n   • اسکلتی (206 استخوان)\n   • عضلانی (عضلات صاف، اسکلتی، قلبی)\n   • گردش خون (قلب، شریان‌ها، وریدها، مویرگ‌ها)\n   • عصبی (مرکزی: مغز و نخاع، محیطی: اعصاب)\n   • تنفسی (بینی، نای، ریه‌ها)\n   • گوارش (دهان، مری، معده، روده، کبد، پانکراس)\n   • ادراری-تناسلی\n🔹 قلب: 4 حفره (دهلیز و بطن راست و چپ)\n🔹 سیکل قلبی: سیستول (انقباض) و دیاستول (استراحت)\n\n🔰 نکات کنکوری:\n• شریان‌ها خون را از قلب دور می‌کنند (معمولاً اکسیژنه، جز شریان ریوی)\n• وریدها خون را به قلب برمی‌گردانند (معمولاً بدون اکسیژن، جز ورید ریوی)\n• دریچه‌های قلب: میترال، آئورت، تری‌کاسپید، پولمونری"}, {"title": "فیزیولوژی سلول عصبی و پتانسیل عمل", "content": "🔹 پتانسیل غشای استراحت (RMP):\n   • ناشی از توزیع نامتقارن یون‌ها (K⁺ داخل، Na⁺ خارج)\n   • پمپ Na-K ATPase: 3 Na⁺ بیرون، 2 K⁺ داخل (با مصرف ATP)\n   • مقدار نرمال برای نورون: -70 mV\n🔹 پتانسیل عمل (Action Potential):\n   • آستانه (Threshold): معمولاً -55 mV\n   • دپولاریزاسیون سریع با باز شدن کانال‌های Na⁺ ولتاژی\n   • اوج: حدود +30 تا +40 mV\n   • رپولاریزاسیون با کانال‌های K⁺\n   • دوره عدم پاسخ مطلق و نسبی\n🔹 هدایت جهشی (Saltatory) در غلاف میلین (سلول‌های شوان)\n🔹 سیناپس و انتقال‌دهنده‌های عصبی (استیل‌کولین، گلوتامات، GABA, ...)\n\n🔰 نکات کنکوری:\n• قانون همه یا هیچ (All or None)\n• سرعت هدایت در فیبرهای قطور و میلین‌دار بیشتر\n• پتانسیل عمل کاردیومیوسیت‌ها دوره عدم پاسخ طولانی دارد (از تیتانوس محافظت)"}, {"title": "الکتروکاردیوگرام (ECG)", "content": "🔹 امواج استاندارد ECG:\n   • P: دپولاریزاسیون دهلیزها\n   • QRS: دپولاریزاسیون بطن‌ها (بزرگترین موج)\n   • T: رپولاریزاسیون بطن‌ها\n🔹 لیدهای استاندارد 12 تایی:\n   • لیدهای اندامی I, II, III, aVR, aVL, aVF\n   • لیدهای سینه‌ای V1-V6\n🔹 بازه‌های زمانی:\n   • PR: 120-200 ms (تأخیر در گره AV)\n   • QRS: 80-120 ms\n   • QT: ~400 ms (وابسته به ضربان)\n🔹 آریتمی‌ها: تاکی‌کاردی (ضربان سریع)، برادی‌کاردی (آهسته)\n🔹 فیبریلاسیون دهلیزی (AFib)، فیبریلاسیون بطنی (VFib)\n\n🔰 نکات کنکوری:\n• گره SA (در دهلیز راست) پیس‌میکر طبیعی: 60-100 bpm\n• سرعت هدایت: سریع‌ترین در Purkinje، آهسته‌ترین در گره AV\n• در STEMI، قطعه ST بالارفته تشخیص داده می‌شود"}, {"title": "فشار خون و همودینامیک", "content": "🔹 فشار خون سیستولیک (SBP): ~ 120 mmHg (انقباض بطن چپ)\n🔹 فشار خون دیاستولیک (DBP): ~ 80 mmHg (استراحت)\n🔹 فشار متوسط شریانی (MAP) ≈ DBP + (SBP-DBP)/3 ≈ 93 mmHg\n🔹 قانون اهم در همودینامیک: ΔP = Q × R\n   • ΔP = اختلاف فشار\n   • Q = برون‌ده قلبی (CO)\n   • R = مقاومت عروقی محیطی (TPR)\n🔹 برون‌ده قلبی: CO = HR × SV (ضربان × حجم ضربه‌ای)\n   • SV = EDV - ESV (حجم پایانی دیاستول - حجم پایانی سیستول)\n🔹 قانون پوازوی: R = 8ηL/(πr⁴) — مقاومت به توان چهارم شعاع!\n🔹 جریان آرام (Laminar) و متلاطم (Turbulent) — عدد رینولدز\n\n🔰 نکات کنکوری:\n• تنظیم کوتاه‌مدت فشارخون با بارورسپتورها (کاروتید، آئورت)\n• اتساع‌پذیری عروق (Compliance) C = ΔV/ΔP\n• فشارخون به صورت غیرمستقیم با کاف فشار (کوروتکوف) اندازه‌گیری می‌شود"}]}, {"id": "biomaterials", "name": "بیومواد", "emoji": "🧪", "color": "#ec4899", "lessons": [{"title": "مقدمه و دسته‌بندی بیومواد", "content": "🔹 بیوماده: هر ماده طبیعی یا مصنوعی که در تماس با سیستم بیولوژیکی برای کاربرد پزشکی استفاده می‌شود\n🔹 کاربردها: ایمپلنت، پروتز، ترمیم بافت، سیستم‌های دارورسانی، ابزار جراحی\n🔹 دسته‌بندی:\n   • فلزات: فولاد زنگ‌نزن 316L، آلیاژهای Co-Cr، Ti و Ti-6Al-4V، Nitinol (حافظه‌دار شکلی)\n   • سرامیک‌ها: آلومینا، زیرکونیا، هیدروکسی‌آپاتیت HA، بیوشیشه (Bioglass)\n   • پلیمرها: PE, PP, PMMA, PET, سیلیکون، PLA, PGA, PCL\n   • کامپوزیت‌ها: ترکیبی از دو یا چند ماده\n   • بیومواد طبیعی: کلاژن، الاستین، کیتوزان، ژلاتین، آلژینات\n\n🔰 نکات کنکوری:\n• Ti به دلیل لایه اکسید TiO2 زیست‌سازگاری بالایی دارد\n• هیدروکسی‌آپاتیت Ca₁₀(PO₄)₆(OH)₂ شبیه فاز معدنی استخوان است\n• Nitinol در استنت‌ها کاربرد دارد"}, {"title": "خواص و زیست‌سازگاری", "content": "🔹 خواص مکانیکی: تنش-کرنش، مدول یانگ، استحکام کششی، چقرمگی، خستگی\n🔹 خواص سطح: زبری، انرژی سطح، آب‌دوستی/آب‌گریزی\n🔹 زیست‌سازگاری (Biocompatibility): قابلیت عملکرد مناسب در کاربرد خاص با پاسخ میزبان مناسب\n🔹 برهم‌کنش ماده-بافت:\n   • پاسخ التهابی (حاد → مزمن → تشکیل کپسول فیبروز)\n   • جذب پروتئین به سطح (اولین رویداد پس از کاشت)\n   • چسبندگی و تکثیر سلولی\n🔹 خون‌سازگاری (Hemocompatibility): عدم فعال‌سازی پلاکت و آبشار انعقاد\n🔹 تست‌ها: In vitro (کشت سلول)، In vivo (حیوان)، کارآزمایی بالینی\n\n🔰 نکات کنکوری:\n• استاندارد ISO 10993 برای ارزیابی زیستی دستگاه‌های پزشکی\n• ترومبوژنیک بودن: موادی با بارداری منفی سطحی (هپارینه) کمتر لخته تشکیل می‌دهند\n• خوردگی فلزات در محیط بدن (به ویژه اطراف ایمپلنت) مشکل اصلی است"}, {"title": "پلیمرهای زیست‌تخریب‌پذیر و دارورسانی", "content": "🔹 پلیمرهای تخریب‌پذیر:\n   • PLA (Polylactic acid): نیمه‌کریستال، استحکام بالا\n   • PGA (Polyglycolic acid): تخریب سریع‌تر\n   • PLGA: کوپلیمر PLA-PGA، سرعت تخریب قابل تنظیم\n   • PCL: تخریب آهسته (2-3 سال)\n🔹 مکانیسم تخریب: هیدرولیز پیوندهای استری\n🔹 سیستم‌های دارورسانی کنترل‌شده:\n   • رهاسازی پیوسته، تأخیری، هدفمند\n   • اشکال: میکرو/نانوذرات، هیدروژل، استنت‌های دارویی، ایمپلنت\n🔹 هیدروژل‌ها: شبکه پلیمری آب‌دوست با قابلیت جذب آب فراوان\n🔹 دارورسانی هدفمند (Targeted): لیگاندهای اختصاصی (آنتی‌بادی، آپتامر)\n\n🔰 نکات کنکوری:\n• PLGA در بخیه‌های جذبی و ایمپلنت‌های دارویی کاربرد دارد\n• سینتیک رهاسازی: درجه صفر، درجه یک، هوگوچی، ریگر-پپاس\n• نانوذرات لیپید-پلیمر برای عبور از سد خونی-مغزی (BBB) تحقیق می‌شوند"}, {"title": "بیومواد در مهندسی بافت و کاربردهای کلینیکی", "content": "🔹 مهندسی بافت: سه ضلع اصلی — داربست (Scaffold) + سلول + فاکتور رشد\n🔹 داربست ایده‌آل: تخلخل بالا، اتصال سلولی مناسب، زیست‌تخریب‌پذیر، خواص مکانیکی متناسب\n🔹 روش‌های ساخت داربست:\n   • الکتروریسی (Electrospinning) — نانوالیاف\n   • پرینت سه‌بعدی زیستی (3D Bioprinting)\n   • Freeze-drying، ذوب-نمک‌زدایی\n🔹 کاربردهای کلینیکی:\n   • مفصل ران و زانو (فلز + سرامیک UHMWPE)\n   • استنت عروقی و قلبی (فلز + دارو)\n   • ایمپلنت دندان (Ti + HA)\n   • پیوند عروق مصنوعی (PET, PTFE/ePTFE)\n   • لنز چشمی (PMMA، سیلیکون، هیدروژل)\n   • دریچه قلب مصنوعی (مکانیکی و بیوپروتز)\n\n🔰 نکات کنکوری:\n• داربست برای استخوان: HA/TCP با تخلخل >100 μm\n• مشکل اصلی دریچه مکانیکی: نیاز ضدانعقاد دائمی (وارفارین)\n• لنز تماسی نرم از هیدروژل‌های سیلیکون ساخته می‌شود"}]}, {"id": "biomechanics", "name": "بیومکانیک", "emoji": "🦴", "color": "#06b6d4", "lessons": [{"title": "استاتیک و دینامیک در بیومکانیک", "content": "🔹 تحلیل نیرو در سیستم اسکلتی-عضلانی به عنوان اهرم\n🔹 سه کلاس اهرم:\n   • کلاس I: تکیه‌گاه بین نیرو و مقاومت (مهره‌های گردن)\n   • کلاس II: مقاومت بین تکیه‌گاه و نیرو (پاشنه پا در ایستادن روی پنجه)\n   • کلاس III: نیرو بین تکیه‌گاه و مقاومت (فلکشن آرنج با دوسر) — رایج‌ترین در بدن\n🔹 تعادل استاتیک: ΣF=0, ΣM=0\n🔹 تعادل دینامیک، تحلیل حرکت راه رفتن (Gait analysis)\n🔹 فازهای راه رفتن: ایستادن (Stance) ~60% و نوسان (Swing) ~40%\n\n🔰 نکات کنکوری:\n• بیشتر مفاصل بدن کلاس III هستند (مزیت مکانیکی کمتر، اما سرعت و دامنه بیشتر)\n• مرکز ثقل (CoM) هنگام راه رفتن حدود 5cm جابه‌جا می‌شود\n• نیروی مفصل ران در راه رفتن 2-3 برابر وزن بدن و در دویدن تا 5 برابر"}, {"title": "خواص مکانیکی بافت‌ها", "content": "🔹 استخوان: ماده کامپوزیت طبیعی (کلاژن برای چقرمگی + HA برای سختی)\n   • استخوان کورتیکال (فشرده): مدول ~17 GPa، مستحکم\n   • استخوان اسفنجی (ترابکولار): متخلخل، قابلیت جذب انرژی\n   • استخوان در جهت طولی قوی‌تر از عرضی (ناهمسانگرد)\n🔹 تاندون و لیگامان: بافت فیبری عمدتاً کلاژن نوع I\n   • تاندون: انتقال نیروی عضله به استخوان (مدول بالا، کشسانی کم)\n   • لیگامان: اتصال استخوان به استخوان\n🔹 غضروف: بافت هیدراته با کلاژن نوع II و آگرکان، سایش کم\n🔹 عضله: مدل هیل (عنصر فعال + فنرهای سری و موازی)\n🔹 عروق خونی: خواص ویسکوالاستیک، غیرخطی، ناهمسانگرد\n\n🔰 نکات کنکوری:\n• رفتار ویسکوالاستیک (وابسته به نرخ کرنش): در اکثر بافت‌های نرم\n• منحنی تنش-کرنش عروق و بافت نرم J شکل است\n• قانون وولف: استخوان مطابق بارگذاری، خود را بازسازی می‌کند"}, {"title": "بیومکانیک سیالات - جریان خون", "content": "🔹 ویسکوزیته خون: ~ 3-4 cP (بیشتر از آب که 1cP است)\n🔹 خون غیرنیوتنی است: ویسکوزیته با نرخ برش کاهش می‌یابد (shear thinning)\n   • اثر فاهریس-لیندکویست: در لوله‌های کوچک ویسکوزیته ظاهری کاهش می‌یابد\n🔹 رینولدز: Re = ρvD/μ\n   • Re<2300 آرام، Re>4000 متلاطم\n   • در اکثر عروق آرام است، جز در آئورت در سیستول\n🔹 عدد ومرسلی (Womersley): α = r√(ρω/μ) — اثر ضربان\n🔹 تنش برشی دیواره (WSS): مهم در تشکیل آترواسکلروز\n🔹 فشارگذاری عروق، موج نبض\n\n🔰 نکات کنکوری:\n• در تنگی شدید (استنوز)، سرعت بالا و فشار پایین (برنولی)\n• جداسازی جریان در انشعابات و نواحی با WSS پایین → مستعد پلاک\n• آنوریسم در نقاط با WSS نوسانی تشکیل می‌شود"}, {"title": "بیومکانیک شکست و ایمپلنت", "content": "🔹 شکست استخوان: از نظر مکانیکی ترکیبی از شکست ترد و نرم\n🔹 خستگی (Fatigue): شکست در بارهای تکراری کمتر از استحکام نهایی\n🔹 اتصال ایمپلنت-استخوان: Osseointegration (یکپارچگی استخوانی با Ti)\n🔹 تطابق مدول یانگ (Modulus mismatch):\n   • مدول Ti ~ 110 GPa، استخوان کورتیکال ~17 GPa\n   • منجر به تنش ساییدگی (Stress shielding) و تحلیل استخوان می‌شود\n🔹 سایش در مفاصل مصنوعی: ذرات پلی‌اتیلن → التهاب → لق شدن\n🔹 طراحی پروتز: بارگذاری صحیح، تثبیت، جلوگیری از خوردگی و سایش\n\n🔰 نکات کنکوری:\n• Stress Shielding از دلایل اصلی شکست طولانی‌مدت ایمپلنت مفصل ران\n• برای رفع آن: آلیاژهای تیتانیوم متخلخل، Co-Cr، و طراحی‌های جدید\n• کمانش ستون مهره، پیچک‌خوردن (Torsion) در شکستگی‌ها"}]}, {"id": "instrumentation", "name": "ابزار دقیق پزشکی و تجهیزات پزشکی", "emoji": "🩺", "color": "#f97316", "lessons": [{"title": "مقدمه و بلوک دیاگرام ابزار پزشکی", "content": "🔹 بلوک‌های اصلی دستگاه‌های پزشکی:\n   • حسگر/الکترود (ورودی بیوسیگنال)\n   • تقویت‌کننده (اغلب آپ‌اَمپ ابزار دقیق)\n   • فیلترهای آنالوگ (LP, HP, Notch)\n   • ADC (مبدل آنالوگ به دیجیتال)\n   • پردازش دیجیتال (میکروکنترلر/پردازنده)\n   • نمایشگر و واسط کاربر\n   • بخش خروجی/محرک\n🔹 بیوپتانسیل‌ها:\n   • ECG: قلبی، 0.5-4 mV، 0.05-150 Hz\n   • EEG: مغزی، 5-100 μV، 0.5-60 Hz\n   • EMG: عضلانی، 0.1-5 mV، 10-5000 Hz\n   • EOG: چشمی، ~0.05-3 mV\n🔹 خطای اندازه‌گیری: دقت، صحت، حساسیت، نویز\n\n🔰 نکات کنکوری:\n• مد تقارنی (CMRR) در تقویت تفاضلی: رد نویز مشترک (مثل 50Hz برق شهر)\n• CMRR بالا برای ECG ضروری (>80dB)\n• الکترودهای سطحی Ag/AgCl رایج‌ترین هستند"}, {"title": "الکترودها و مبدل‌ها", "content": "🔹 الکترودهای بیوپتانسیل:\n   • Ag/AgCl (غیرقطبش‌پذیر) — بهترین برای ECG/EEG\n   • فلزی ساده (قطبش‌پذیر)\n   • سوزنی (EMG، پتانسیل‌های درونی)\n🔹 پتانسیل نیم‌سلولی (Half-cell potential)\n🔹 الکترودهای مرجع، زمین و فعال\n🔹 مبدل‌ها (Transducers):\n   • استرین گیج (فشار، نیرو، کرنش) — پل وتستون\n   • LVDT (جابه‌جایی)\n   • ترمیستور و ترموکوپل (دما)\n   • پیزوالکتریک (فشار، شتاب، اولتراسوند)\n   • فوتودیود/فتودیود (اپتیک، پالس‌اکسی‌متر)\n\n🔰 نکات کنکوری:\n• ژل الکترود برای کاهش امپدانس تماس پوست-الکترود\n• در پل وتستون، یک استرین گیج فعال → V_out ∝ کرنش\n• پیزوالکتریک برای سیگنال‌های دینامیک مناسب (نه استاتیک)"}, {"title": "تجهیزات تشخیصی رایج", "content": "🔹 الکتروکاردیوگراف: تقویت‌کننده با بهره ~1000، CMRR بالا، فیلتر 0.05-150Hz\n🔹 الکتروآنسفالوگراف: باندهای فرکانسی\n   • δ (delta): 0.5-4 Hz (خواب عمیق)\n   • θ (theta): 4-8 Hz (خواب سبک)\n   • α (alpha): 8-13 Hz (بیدار آرام، چشم بسته)\n   • β (beta): 13-30 Hz (هوشیار، فعال)\n🔹 فشارسنج غیرمستقیم (کاف)، کوروتکوف\n🔹 پالس‌اکسی‌متر (SpO₂): دو طول موج 660nm قرمز و 940nm مادون قرمز\n🔹 ترمومتر دیجیتال\n🔹 اسپیرومتر (تنفس)، جریان‌سنج هوا\n🔹 گلوکومتر (قند خون)\n\n🔰 نکات کنکوری:\n• بند α هنگام بستن چشم پدیدار و بازکردن چشم محو می‌شود\n• در پالس‌اکسی‌متر از قانون بیر-لامبرت استفاده می‌شود\n• R-R interval در ECG برای مانیتور ضربان قلب"}, {"title": "تجهیزات درمانی و ایمنی الکتریکی", "content": "🔹 دیفیبریلاتور: شوک الکتریکی ~200-360 J (یا دوقطبی 120-200J) با خازن بزرگ در 3-10ms\n🔹 پیس‌میکر (Pacemaker): تنظیم ضربان قلب، پالس‌های کوتاه\n🔹 دفیبریلاتور کاشتنی (ICD) — تشخیص و درمان آریتمی‌های خطرناک\n🔹 الکتروسرجری (Electrosurgery): برش و انعقاد بافت با جریان بالا فرکانس\n🔹 قلب-ریه مصنوعی (Bypass)، دیالیز کلیه\n🔹 ایمنی الکتریکی:\n   • ماکروشوک (جریان از روی پوست): 1mA آستانه احساس، 10-20mA انقباض (رها نکردن)، 100mA به بالا خطر فیبریلاسیون\n   • میکروشوک (مستقیم به قلب): تا 10 μA خطرناک!\n🔹 جریان نشتی (Leakage current) باید محدود شود\n\n🔰 نکات کنکوری:\n• زمین کردن مناسب و پریزهای بیمارستانی\n• ترانسفورمرهای ایزولاسیون در اتاق عمل\n• پایه اتصال تجهیزات هم‌پتانسیل (Equipotential)"}]}, {"id": "imaging", "name": "تصویربرداری پزشکی", "emoji": "🔬", "color": "#14b8a6", "lessons": [{"title": "اشعه ایکس و رادیوگرافی", "content": "🔹 تولید اشعه X: لامپ X-ray با کاتد تنگستن داغ و آند\n   • ترمزی (Bremmsstrahlung): طیف پیوسته\n   • خطوط مشخصه: گسسته (Kα, Kβ با انتقال الکترون لایه‌ها)\n🔹 جذب: I = I₀·exp(-μx) — قانون نمایی\n🔹 کنتراست: به اختلاف ضریب تضعیف μ بافت‌ها بستگی دارد\n   • استخوان: μ بالا (جذب بالا، سفید)\n   • ریه: هوا، μ پایین (سیاه)\n   • بافت نرم: متوسط\n🔹 ماده کنتراست‌زا (باریم، ید) — μ بالا با عدد اتمی بزرگ\n🔹 رادیوگرافی دیجیتال (DR) و CR، فلوروسکوپی\n🔹 دوز: واحدهای Gray (Gy، انرژی جذبی) و Sievert (Sv، اثر بیولوژیکی)\n\n🔰 نکات کنکوری:\n• کنتراست طبیعی با اختلاف چگالی\n• ماموگرافی با kVp پایین (25-35) و هدف Mo\n• قانون عکس مجذور فاصله: شدت به 1/r² کاهش می‌یابد"}, {"title": "سی‌تی‌اسکن (CT)", "content": "🔹 اصول: چرخش منبع X و دتکتورها دور بیمار، بازسازی مقطع\n🔹 نسل‌ها: pencil beam → fan-beam → spiral/helical → MDCT\n🔹 عدد هانسفیلد (HU):\n   • آب = 0\n   • هوا = -1000\n   • استخوان کورتیکال = +1000 تا +3000\n   • بافت نرم ~ +20 تا +80\n   • چربی ~ -100\n🔹 الگوریتم‌های بازسازی:\n   • فیلتر-بک‌پروجکشن (Filtered Back Projection, FBP)\n   • بازسازی تکراری (IR) — نویز کمتر، دوز کمتر\n🔹 آرتیفکت‌ها: هاردنینگ بیم، استریاک، حرکت، فلزی\n🔹 CT اسپیرال، CT دوز پایین، CT قلبی\n\n🔰 نکات کنکوری:\n• پنجره‌بندی (Windowing) برای نمایش بهتر بافت:\n   – Window لنگ (W=1500, L=-600) برای ریه\n   – Window استخوان (W=2000, L=400)\n   – Window مغز/بافت نرم (W=80-100, L=40)"}, {"title": "اولتراسوند تشخیصی", "content": "🔹 امواج فراصوت با فرکانس 2-18 MHz (اغلب 3-10MHz)\n🔹 پدیده پیزوالکتریک: تولید موج با کریستال (PZT)\n🔹 امپدانس صوتی Z = ρ·c (kg/(m²·s) = Rayl)\n🔹 ضریب بازتاب در سطح مشترک: R = (Z₂-Z₁)²/(Z₂+Z₁)²\n🔹 رابط هوا-پوست: R≈99.9%، به همین دلیل ژل لازم است\n🔹 تضعیف: α (dB/cm) تقریباً متناسب با فرکانس\n🔹 مُدها:\n   • A-mode (دامنه)، B-mode (روشنایی/تصویر مقطعی دو بعدی)\n   • M-mode (حرکت، برای قلب)\n   • داپلر: رنگی و پالسی (جریان خون)\n🔹 تصویربرداری داپلر: Δf = 2f₀·v·cosθ/c\n\n🔰 نکات کنکوری:\n• فرکانس بالا → رزولوشن بهتر، نفوذ کمتر\n• فرکانس پایین → نفوذ بیشتر، رزولوشن بدتر\n• آرتیفکت‌های رایج: آکوستیک شدو، افزایش پشت، روربند (Reverberation)"}, {"title": "MRI و پزشکی هسته‌ای", "content": "🔹 MRI: بر اساس رزونانس مغناطیسی هسته هیدروژن (پروتون)\n🔹 میدان اصلی قوی (B₀): 0.5T تا 3T و بالاتر\n🔹 Larmor: ω₀ = γ·B₀ ، γ نسبت ژیرومغناطیسی\n🔹 وزن‌دهی تصاویر:\n   • T1-weighted: چربی روشن، مایع تیره\n   • T2-weighted: مایع روشن، چربی تیره‌تر\n   • FLAIR: مایع مغزی-نخاعی سرکوب\n   • DWI (نفوذ): برای سکته ایسکمیک حاد\n🔹 کنتراست‌های پارامغناطیس (گادولینیوم)\n🔹 پزشکی هسته‌ای:\n   • PET: ردیاب گسیل پوزیترون (¹⁸F-FDG)، همزمان دو گاما 511keV\n   • SPECT: گاما دوربین، تک‌فوتون\n   • گاما کمرا (Scintillation)، بلور NaI(Tl)\n\n🔰 نکات کنکوری:\n• MRI یونیزان نیست اما میدان قوی و RF دارد — ایمنی فلزات و ایمپلنت مهم\n• در PET، ردیاب متابولیکی (مانند FDG) نواحی پرمتابولیسم (تومور) را نشان می‌دهد\n• SPECT ارزان‌تر از PET اما رزولوشن پایین‌تر"}]}, {"id": "control", "name": "کنترل سیستم‌ها", "emoji": "🎛️", "color": "#6366f1", "lessons": [{"title": "مفاهیم پایه و نمایش سیستم", "content": "🔹 حلقه بسته (Feedback) در مقابل حلقه باز\n🔹 ورودی مرجع (Setpoint)، خروجی، سیگنال خطا، کنترل‌کننده، فرایند\n🔹 تابع تبدیل G(s)=Y(s)/U(s)\n🔹 دیاگرام بلوکی و ساده‌سازی\n🔹 تابع تبدیل حلقه بسته: T(s) = G(s)C(s)/(1+G(s)C(s)H(s))\n🔹 پاسخ گذرا و ماندگار\n🔹 سیگنال‌های تست استاندارد: پله، شیب (رمپ)، سهمی، ضربه\n\n🔰 نکات کنکوری:\n• در کنترل حلقه‌بسته، به عدم قطعیت مقاومیم\n• H(s)=1 به آن بازخورد واحد می‌گویند\n• کاربرد در درایوهای تزریق دارو، پیس‌میکر، ونتیلاتور، ربات‌های جراحی"}, {"title": "پایداری و تحلیل پاسخ", "content": "🔹 پایداری: خروجی برای ورودی محدود، محدود بماند (BIBO)\n🔹 پایداری از روی قطب‌ها: همه قطب‌های T(s) در نیم‌صفحه چپ s-plane\n🔹 معیار پایداری روث-هورویتس\n🔹 معیار پایداری نایکوییست (Nyquist): دور (-1,0)\n🔹 حاشیه بهره (GM) و حاشیه فاز (PM) از دیاگرام بود\n   • PM > 45° مطلوب\n   • GM > 6 dB مطلوب\n🔹 پاسخ گذرای سیستم مرتبه دوم:\n   • ω_n فرکانس طبیعی، ζ ضریب میرایی\n   • overshoot %: OS = 100·exp(-ζπ/√(1-ζ²))\n   • زمان نشست t_s ≈ 4/(ζω_n) (معیار 2%)\n   • زمان اوج t_p = π/(ω_n√(1-ζ²))\n\n🔰 نکات کنکوری:\n• میرایی بحرانی ζ=1، زیرمیرا ζ<1 (نوسانی)، زبرمیرا ζ>1\n• حالت مطلوب برای پاسخ خوب ζ≈0.7 (OS≈5%)\n• خطای حالت ماندگار به نوع سیستم و DC بهره بستگی دارد"}, {"title": "طراحی کنترل‌کننده", "content": "🔹 کنترل تناسبی P: u = K_p·e\n   • بهره بالا → خطای کم اما ممکن است ناپایدار شود\n🔹 کنترل انتگرالی I: u = K_i·∫e dt\n   • خطای حالت ماندگار را حذف می‌کند اما پایداری را کاهش می‌دهد\n🔹 کنترل مشتقی D: u = K_d·de/dt\n   • پایداری را بهبود و overshoot را کم می‌کند، اما نویز را زیاد می‌کند\n🔹 کنترل‌کننده PID: ترکیب\n   u = K_p·e + K_i·∫e dt + K_d·de/dt\n🔹 روش زیگلر-نیکولز برای تنظیم PID\n🔹 کنترل‌کننده Lead/Lag در فرکانس\n🔹 کنترل مدرن: فضای حالت، LQR، کنترل تطبیقی\n\n🔰 نکات کنکوری:\n• در تنظیمات کلاسیک Z-N، نوسان پایدار با P خالص → K_u و T_u\n• D به تغییرات سریع حساس است و برای سیستم با نویز زیاد مناسب نیست\n• I باعث Windup می‌شود (وقتی عملگر اشباع)، باید Anti-windup داشت"}, {"title": "کاربرد در سیستم‌های فیزیولوژیکی و پزشکی", "content": "🔹 کنترل قند خون در حلقه بسته (پانکراس مصنوعی)\n   • مدل مینیمال برگمن، MPC کنترل\n   • سنسور CGM + پمپ انسولین\n🔹 کنترل تحویل بیهوشی (BIS، سِووفلوران)\n🔹 کنترل فشار خون با داروهای وازواکتیو\n🔹 کنترل ونتیلاتور (فشار، حجم، FiO₂، PEEP)\n🔹 ربات‌های جراحی (مانند داوینچی)\n🔹 ربات‌های توانبخشی و ارتز/پروتز فعال\n🔹 قلب-ریه مصنوعی (ECMO) و کنترل جریان/فشار\n\n🔰 نکات کنکوری:\n• تأخیر زمانی در سیستم‌های دارورسانی (مثل انسولین) چالش مهم کنترل است\n• سیستم‌های فیزیولوژیکی نامعین، غیرخطی و متغیر با زمان هستند\n• ایمنی در سیستم‌های درمانی از مهمترین قیود طراحی است"}]}], "question_bank": {"math": [{"q": "جواب عمومی معادله دیفرانسیل y' + 2y = e^(-x) کدام است؟", "choices": ["y = e^(-x) + Ce^(-2x)", "y = e^(-x) + Ce^(2x)", "y = e^(x) + Ce^(-2x)", "y = -e^(-x) + Ce^(-2x)"], "answer": 0, "year": 1401, "konkori": "با عامل انتگرال‌ساز μ=e^(2x) یا با حدس پاسخ خصوصی + همگن. جواب خصوصی از نوع Ae^(-x) است → A=1. پاسخ کلی = پاسخ خصوص + پاسخ همگن.", "full_solution": "عامل انتگرال‌ساز μ = exp(∫2 dx) = e^(2x)\nدر معادله ضرب می‌کنیم: d/dx(y·e^(2x)) = e^x\nانتگرال: y·e^(2x) = e^x + C → y = e^(-x) + C·e^(-2x)"}, {"q": "معادله مشخصه کدام گزینه یک ریشه حقیقی و دو ریشه مختلط دارد؟", "choices": ["r³ + 2r² + r + 2 = 0", "r³ - r = 0", "r³ + r² + r + 1 = 0", "r³ - 1 = 0"], "answer": 0, "year": 1400, "konkori": "فاکتورگیری سریع: r³+2r²+r+2 = r²(r+2)+1(r+2) = (r²+1)(r+2). همین یک جمله مشخص می‌کند r=-2 حقیقی و r=±i مختلط هستند.", "full_solution": "(r+2)(r²+1)=0 → ریشه‌ها r=-2, r=+j, r=-j. پس یک ریشه حقیقی و دو ریشه مختلط مزدوج."}, {"q": "در توزیع نمایی با پارامتر λ، امید ریاضی و واریانس به ترتیب کدامند؟", "choices": ["λ و λ²", "1/λ و 1/λ²", "λ و λ", "1/λ و λ"], "answer": 1, "year": 1399, "konkori": "حفظی: در نمایی میانگین=۱/λ و واریانس=۱/λ² (هر دو به نرخ λ وابسته).", "full_solution": "E[X] = ∫₀^∞ x λe^(-λx)dx = 1/λ\nE[X²] = ∫₀^∞ x² λe^(-λx)dx = 2/λ²\nVar = E[X²]-E[X]² = 2/λ² - 1/λ² = 1/λ²"}, {"q": "اگر X~N(μ,σ²)، متغیر Z استاندارد چیست؟", "choices": ["X/σ", "(X-μ)/σ", "(X-μ)/σ²", "X/μ"], "answer": 1, "year": 1398, "konkori": "استانداردسازی با کم کردن میانگین و تقسیم بر انحراف معیار.", "full_solution": "اگر X ~ N(μ,σ²) آنگاه Z=(X-μ)/σ دارای توزیع N(0,1) است."}, {"q": "ضریب b₁ سری فوریه f(x)=x روی (-π,π) کدام است؟", "choices": ["0", "2", "-2", "π"], "answer": 1, "year": 1397, "konkori": "تابع x فرد است، پس سری فقط سینوس دارد. b₁=2 (نتیجه انتگرال جز به جز ساده).", "full_solution": "b_n = (1/π)∫_{-π}^{π} x sin(nx)dx\nبا انتگرال جز به جز: b₁=2."}, {"q": "F{f'(t)} =؟", "choices": ["F(ω)", "jωF(ω)", "F'(ω)", "F(ω)/(jω)"], "answer": 1, "year": 1396, "konkori": "خاصیت مشتق‌گیری فوریه: ضرب در jω.", "full_solution": "با انتگرال جزء به جز از تعریف تبدیل فوریه نتیجه می‌شود F{f'(t)} = jω·F(ω)."}, {"q": "مجموع مانده‌های f(z)=1/[z(z-1)] کدام است؟", "choices": ["0", "1", "-1", "2"], "answer": 0, "year": 1395, "konkori": "مانده در z=0 برابر -1 و در z=1 برابر ۱ است؛ جمع صفر.", "full_solution": "Res(z=0) = lim z·f(z) = -1\nRes(z=1) = lim (z-1)f(z) = 1\nمجموع = 0."}, {"q": "در آزمون فرض، خطای نوع اول چیست؟", "choices": ["قبول H₀ وقتی غلط است", "رد H₀ وقتی درست است", "رد H₁ وقتی درست است", "قبول همزمان H₀ و H₁"], "answer": 1, "year": 1394, "konkori": "خطای نوع اول α = رد نابجای فرض صفر. نوع دوم β = قبول نابجا.", "full_solution": "خطای نوع اول (False Positive) به احتمال α رخ می‌دهد و در تصمیم‌گیری‌های آماری سطح معنادار آزمون را تعیین می‌کند."}, {"q": "اگر A,B مستقل P(A)=0.4,P(B)=0.5 باشد، P(A∪B) کدام است؟", "choices": ["0.9", "0.7", "0.2", "0.5"], "answer": 1, "year": 1403, "konkori": "در استقلال P(A∩B)=P(A)P(B)=0.2، پس اتحاد 0.4+0.5-0.2=0.7.", "full_solution": "P(A∪B)=P(A)+P(B)-P(A∩B) = 0.4+0.5-0.2=0.7"}, {"q": "جواب y''+ω²y=0 چه رفتاری دارد؟", "choices": ["رشد نمایی", "نوسانی ساده بدون میرایی", "میرایی بحرانی", "مرتبه اول"], "answer": 1, "year": 1402, "konkori": "معادله نوسان‌ساز هماهنگ ساده، جواب Acosωt+Bsinωt.", "full_solution": "ریشه‌های معادله مشخصه r²+ω²=0 → r=±jω، جواب به صورت ترکیب سینوس/کسینوس."}, {"q": "جواب معادله y dy/dx = x با y(0)=1؟", "choices": ["y²=x²+1", "y=x+1", "y²=x²", "y=x²+1"], "answer": 0, "year": 1403, "konkori": "اعمال شرط y(0)=1 روی گزینه‌ها: گزینه ۱ با قرار دادن x=0,y=1 صدق می‌کند؛ بقیه خیر.", "full_solution": "جداسازی: ∫y dy = ∫x dx → y²/2 = x²/2 + C\ny(0)=1 → C=1/2 → y²=x²+1"}, {"q": "اگر A و B ناسازگار باشند P(A|B)؟", "choices": ["0", "0.4", "0.3", "0.7"], "answer": 0, "year": 1402, "konkori": "ناسازگار یعنی A∩B=∅، پس احتمال شرطی صفر.", "full_solution": "P(A|B)=P(A∩B)/P(B)=0/P(B)=0"}, {"q": "کدام تابع زوج است؟", "choices": ["x³", "x·sinx", "x+cosx", "x²·sinx"], "answer": 1, "year": 1401, "konkori": "ضرب دو تابع فرد، تابع زوج می‌سازد. x و sinx هر دو فردند، پس حاصل‌ضربشان زوج.", "full_solution": "f(-x)=(-x)·sin(-x)=(-x)(-sinx)=xsinx=f(x)"}, {"q": "∫₀^∞ δ(t-2) e^(-t) dt =؟", "choices": ["e²", "e⁻²", "1", "0"], "answer": 1, "year": 1400, "konkori": "خاصیت غربالی ضربه دیراک: مقدار تابع در نقطه ۲.", "full_solution": "∫ f(t)δ(t-a)dt = f(a) = e⁻²"}, {"q": "مقادیر ویژه ماتریس [[2,1],[1,2]]؟", "choices": ["1 و 3", "2 و 2", "0 و 4", "-1 و 5"], "answer": 0, "year": 1399, "konkori": "اثر=4، دترمینان=3. فقط گزینه ۱ جمع ۴ و ضرب ۳ دارد.", "full_solution": "det(A-λI)=0 → (2-λ)²-1=0 → λ=1,3"}], "physics": [{"q": "مقاومت معادل دو مقاومت R₁ و R₂ موازی کدام است؟", "choices": ["R₁+R₂", "R₁R₂/(R₁+R₂)", "(R₁+R₂)/2", "R₁²+R₂²"], "answer": 1, "year": 1398, "konkori": "فرمول حفظی مقاومت موازی: حاصلضرب روی مجموع.", "full_solution": "1/R_eq = 1/R₁+1/R₂ = (R₁+R₂)/R₁R₂ → R_eq = R₁R₂/(R₁+R₂)"}, {"q": "بسامد تشدید مدار RLC سری؟", "choices": ["1/(LC)", "1/√(LC)", "R/L", "LC"], "answer": 1, "year": 1397, "konkori": "فرکانس تشدید ω₀=1/√(LC) (هنگامی که X_L=X_C).", "full_solution": "در تشدید امپدانس سلف و خازن خنثی می‌شوند: ωL=1/(ωC) → ω²=1/(LC) → ω₀=1/√(LC)"}, {"q": "شدت صوت آستانه درد (120 dB) چند W/m² است؟ (I₀=10⁻¹²)", "choices": ["1", "10", "100", "0.1"], "answer": 0, "year": 1396, "konkori": "120dB یعنی 12 تقسیم بر 10 → توان 10¹²، در I₀ ضرب می‌شود → 1.", "full_solution":  با حدس پاسخ خصوصی + همگن. جواب خصوصی از نوع Ae^(-x) است → A=1. پاسخ کلی = پاسخ خصوص + پاسخ همگن.", "full_solution": "عامل انتگرال‌ساز μ = exp(∫2 dx) = e^(2x)\nدر معادله ضرب می‌کنیم: d/dx(y·e^(2x)) = e^x\nانتگرال: y·e^(2x) = e^x + C → y = e^(-x) + C·e^(-2x)", "subject": "math"}, {"q": "ζ بهینه برای پاسخ سریع با overshoot کم؟", "choices": ["0", "0.7", "1", "2"], "answer": 1, "year": 1399, "konkori": "میرایی حدود ۰.۷ (≈√2/2) پاسخ بهینه با حدود ۵% overshoot.", "full_solution": "این مقدار به عنوان استاندارد در طراحی صنعتی کاربرد دارد.", "subject": "control"}, {"subject": "biomaterials", "q": "چرا PMMA در چشم‌پزشکی کاربرد دارد؟", "choices": ["زیست‌تخریب‌پذیر", "شفاف و دارای خواص نوری مناسب (لنز داخل چشمی)", "رسانا", "بسیار نرم"], "answer": 1, "explanation": "PMMA شیشه پلکسی است و در لنز‌های سخت چشمی استفاده می‌شود."}, {"q": "استخوان چه نوع ماده‌ای است؟", "choices": ["فلز خالص", "پلیمر ساده", "کامپوزیت طبیعی", "سرامیک خالص"], "answer": 2, "year": 1397, "konkori": "استخوان کامپوزیت کلاژن + هیدروکسی‌آپاتیت.", "full_solution": "فاز آلی کلاژن چقرمگی و فاز معدنی HA استحکام می‌بخشد.", "subject": "biomechanics"}, {"subject": "physics", "q": "کمیت کدام موج در کاربردهای اولتراسوند پزشکی اهمیت دارد؟", "choices": ["موج الکترومغناطیسی", "موج مکانیکی طولی", "موج عرضی در خلأ", "نور"], "answer": 1, "explanation": "اولتراسوند موج مکانیکی (فشاری/طولی) در محیط‌های مادی است."}, {"q": "نسبت ولتاژ خط به فاز در سه‌فاز ستاره؟", "choices": ["1", "√2", "√3", "2"], "answer": 2, "year": 1403, "konkori": "در ستاره V_L=√3 V_ph، در مثلث I_L=√3 I_ph.", "full_solution": "به اختلاف فاز 120 درجه بین ولتاژهای فاز، مقدار خط √3 برابر فاز می‌شود.", "subject": "circuits"}, {"q": "F{f'(t)} =؟", "choices": ["F(ω)", "jωF(ω)", "F'(ω)", "F(ω)/(jω)"], "answer": 1, "year": 1396, "konkori": "خاصیت مشتق‌گیری فوریه: ضرب در jω.", "full_solution": "با انتگرال جزء به جز از تعریف تبدیل فوریه نتیجه می‌شود F{f'(t)} = jω·F(ω).", "subject": "math"}, {"subject": "math", "q": "معادله دیفرانسیل y'' + 2y' + y=0 چه نوع میرایی دارد؟" → y=(C₁+C₂x)e^{rx}\n• Δ<0: ریشه مختلط α±jβ → y=e^{αx}(C₁cosβx+C₂sinβx)\n\nبرای ناهمگن: ضرایب نامعین یا تغییر پارامتر لاگرانژ.\n🔑 ترفند: اگر مجموع ضرایب صفر است r=1 یک ریشه است."}, {"title": "۳. تبدیل لاپلاس", "body": "L{f'}=sF(s)-f(0), L{f''}=s²F(s)-sf(0)-f'(0)\nL{1}=1/s, L{e^{at}}=1/(s-a), L{sinωt}=ω/(s²+ω²)\nکاربرد اصلی: حل ODE با شرایط اولیه و تحلیل مدار/سیستم.\nمهم‌ترین مزیت لاپلاس: بدون محاسبه ثابت‌ها مستقیم به جواب می‌رسی!"}, {"title": "۴. آمار و احتمال", "body": "P(A|B)=P(A∩B)/P(B)\nقضیه بیز: P(B|A)=P(A|B)P(B)/P(A)\nتوزیع‌های کلیدی:\n• نرمال N(μ,σ²)\n• نمایی (بی‌حافظگی) E=1/λ\n• پواسون E=Var=λ\n• دوجمله‌ای E=np\nاستانداردسازی نرمال Z=(X-μ)/σ ~ N(0,1)"}, {"title": "۵. سری و انتگرال فوریه", "body": "برای تابع تناوبی T=2L:\nf(x)=a₀/2+Σ[a_n cos(nπx/L)+b_n sin(nπx/L)]\nتابع زوج → فقط کسینوس (b_n=0)\nتابع فرد → فقط سینوس (a₀=a_n=0)\nخاصیت کلیدی: کانوالوشن در زمان ↔ ضرب در فرکانس\n📌 کاربرد: تحلیل طیف ECG/EEG، طراحی فیلتر، پردازش تصویر."}]}, "physics": {"intro": "سلام! استاد اینجا هستم 🧑‍🏫\nمی‌خوایم باهم درس «فیزیک (الکتریسیته، مکانیک، موج و ارتعاش)» رو اصولی و کنکوری یاد بگیریم. از صفر شروع می‌کنیم، فرمول‌ها رو با هم تمرین می‌کنیم، نکات کنکوری رو یاد می‌گیری و در انتها هم سوال می‌زنیم.", "slides": [{"title": "مرور فیزیک", "body": "سه بخش: الکتریسیته/مغناطیس، مکانیک، موج و پرتو.\nحدود ۸-۱۰ سوال در کنکور. فرمول‌ها را حفظ و زیاد مساله بزن."}, {"title": "الکتریسیته DC", "body": "قانون اهم V=IR\nسری/موازی مقاومت و خازن\nKCL و KVL\nτ_RC=RC, τ_RL=L/R\n🔹 در t=0+ خازن اتصال کوتاه، سلف مدار باز."}, {"title": "موج و نوسان", "body": "موج سینوسی y=Asin(kx-ωt)\nβ=10log(I/I₀) دسی‌بل\nدوپلر: نزدیک شدن → فرکانس بیشتر\nنوسان ساز ساده ω=√(k/m), T=2π/ω\nآونگ ω=√(g/L)\nامواج EM: c=λf"}, {"title": "پرتوها", "body": "فوتوالکتریک K_max=hf-φ\nI=I₀e^{-μx} جذب نمایی\nنیم‌عمر T½=ln2/λ\nآلفا کمترین نفوذ، گاما بیشترین\nاشعه X: ترمزی + خطوط مشخصه\nHVL=ln2/μ"}]}, "circuits": {"intro": "سلام! استاد اینجا هستم 🧑‍🏫\nمی‌خوایم باهم درس «مدارهای الکتریکی» رو اصولی و کنکوری یاد بگیریم. از صفر شروع می‌کنی ject": "math"}, {"q": "مقادیر ویژه ماتریس [[2,1],[1,2]]؟", "choices": ["1 و 3", "2 و 2", "0 و 4", "-1 و 5"], "answer": 0, "year": 1399, "konkori": "اثر=4، دترمینان=3. فقط گزینه ۱ جمع ۴ و ضرب ۳ دارد.", "full_solution": "det(A-λI)=0 → (2-λ)²-1=0 → λ=1,3", "subject": "math"}, {"q": "مقاومت معادل دو مقاومت R₁ و R₂ موازی کدام است؟", "choices": ["R₁+R₂", "R₁R₂/(R₁+R₂)", "(R₁+R₂)/2", "R₁²+R₂²"], "answer": 1, "year": 1398, "konkori": "فرمول حفظی مقاومت موازی: حاصلضرب روی مجموع.", "full_solution": "1/R_eq = 1/R₁+1/R₂ = (R₁+R₂)/R₁R₂ → R_eq = R₁R₂/(R₁+R₂)", "subject": "physics"}, {"q": "بسامد تشدید مدار RLC سری؟", "choices": ["1/(LC)", "1/√(LC)", "R/L", "LC"], "answer": 1, "year": 1397, "konkori": "فرکانس تشدید ω₀=1/√(LC) (هنگامی که X_L=X_C).", "full_solution": "در تشدید امپدانس سلف و خازن خنثی می‌شوند: ωL=1/(ωC) → ω²=1/(LC) → ω₀=1/√(LC)", "subject": "physics"}, {"q": "شدت صوت آستانه درد (120 dB) چند W/m² است؟ (I₀=10⁻¹²)", "choices": ["1", "10", "100", "0.1"], "answer": 0, "year": 1396, "konkori": "120dB یعنی 12 تقسیم بر 10 → توان 10¹²، در I₀ ضرب می‌شود → 1.", "full_solution": "β=10log₁₀(I/I₀) → 120=10log₁₀(I/10⁻¹²) → I=1 W/m²", "subject": "physics"}, {"q": "اثر فوتوالکتریک کدام ویژگی نور را اثبات می‌کند؟", "choices": ["موج بودن", "ذره‌ای بودن", "قطبش", "پراش"], "answer": 1, "year": 1395, "konkori": "فوتوالکتریک با فوتون (بسته انرژی) توضیح داده می‌شود.", "full_solution": "انرژی فوتون E=hf، تنها وقتی الکترون از سطح فلز جدا می‌شود که فرکانس نور از حد آستانه بیشتر باشد.", "subject": "physics"}, {"q": "در نوسان ساز ساده، در نقطه حداکثر جابه‌جایی کدام درست است؟", "choices": ["سرعت ماکزیمم", "شتاب صفر", "انرژی جنبشی صفر", "نیرو صفر"], "answer": 2, "year": 1394, "konkori": "در دامنه ماکزیمم، سرعت لحظه‌ای صفر است.", "full_solution": "در نقاط بازگشت، v=0 پس KE=0؛ شتاب و نیرو ماکزیمم هستند.", "subject": "physics"}, {"q": "نیم‌عمر T½=10 روز؛ بعد از چند روز ۷/۸ ماده متلاشی می‌شود؟", "choices": ["10", "20", "30", "40"], "answer": 2, "year": 1403, "konkori": "باقی‌مانده 1/8=(1/2)³ یعنی ۳ نی "0", "5", "25", "50"], "answer": 1, "year": 1397, "konkori": "ζ≈0.7 معادل حدود ۵ درصد فراجهش است.", "full_solution": "OS%=100·exp(-ζπ/√(1-ζ²))≈4.3%≈5%", "subject": "control"}], "foundation": {"math": {"title": "ریاضیات از صفر تا کنکور", "levels": [{"name": "سطح ۱ — پایه (کسی که هیچی بلد نیست)", "lessons": [{"title": "یادآوری اعداد و توابع", "body": "سلام دوست من! 🧑‍🏫\nنگران نباش، از صفرِ صفر شروع می‌کنیم. حتی اگر دبیرستان هم خوب ریاضی نخوندی، با من می‌تونی یاد بگیری.\n\n🔹 اول چی هست «تابع»؟\nفرض کن یه دستگاه جادویی داری. اگر بهش یک عدد (ورودی) بدی، دقیقاً یک عدد بهت برمی‌گردونه (خروجی). به این دستگاه تابع می‌گن.\n\nمثال ساده:\nf(x) = 2x + 1\nاگه ورودی x=2 باشه، خروجی میشه: 2×2+1 = 5\nاگه ورودی x=0 باشه: 0+1 = 1\nاگه ورودی x=-1 باشه: -2+1 = -1\n\nچرا به تابع نیاز داریم؟\nتمام پدیده‌های دنیای اطراف ما با تابع توصیف می‌شن:\n• سرعت ماشین نسبت به زمان\n• دمای هوا در ساعت‌های مختلف روز\n• ولتاژ خروجی ECG نسبت به زمان\n• مقدار دارو در خون بعد از تزریق\n\n🔹 انواع اعداد که باید بشناسی:\n• اعداد طبیعی: ۱، ۲، ۳، ۴، ... (مثل تعداد سیب)\n• اعداد صحیح: ...، -۲، -۱، ۰، ۱، ۲، ... (هم منفی هم مثبت)\n• اعداد حقیقی: تمام اعدادی که می‌تونی روی خط عددی نشون بدی (مثل ۱.۵، ۳.۱۴، √۲)\n\n⚠️ نکته مهم: وقتی میگن دامنه تابع، یعنی چه اعدادی می‌تونیم به عنوان ورودی بهش بدیم.\nمثلاً f(x)=1/x، نمی‌تونیم ورودی صفر بدیم (تقسیم بر صفر بی‌معناست)."}, {"title": "مشتق — چیه و چجوری حساب میشه", "body": "مشتق چیه؟ خیلی ساده:\nمشتق یک تابع یعنی «شیب خط مماس بر منحنی در یک نقطه» یا به زبان ساده‌تر «سرعت تغییرات تابع» در اون نقطه.\n\n🔹 مثال واقعی:\n- اگه تابع مکان ماشین نسبت به زمان باشه، مشتقش میشه سرعت ماشین\n- اگه تابع سرعت باشه، مشتقش میشه شتاب\n\nقوانین مشتق‌گیری (کافیه این چند تا رو حفظ کنی):\n1. مشتق عدد ثابت همیشه صفر است\n   مثلاً مشتق عدد ۵ برابر ۰\n\n2. مشتق xⁿ برابر n·x^(n-1) است\n   مثلاً مشتق x² برابر 2x¹ = 2x\n   مشتق x³ برابر 3x²\n   مشتق x برابر 1 (چون n=1، 1·x⁰=1)\n\n3. مشتق جمع توابع، جمع مشتق‌هایشونه\n   (f+g)' = f' + g'\n\n4. مشتق ضریب ثابت: (a·f)' = a·f'\n   مشتق 3x² برابر 6x\n\n🎯 مثال ساده:\nf(x) = 3x² + 2x + 5\nf'(x) = 6x + 2 + 0 = 6x + 2\n\nتمرین برای تو: مشتق f(x)=x³-4x+7 چنده؟\nجواب: 3x² - 4"}, {"title": "انتگرال چیه؟", "body": "اگه مشتق گرفتن «شیب خط» بود، انتگرال گرفتن یعنی «مساحت زیر منحنی».\n\nمثال ساده: اگه سرعت ماشین رو در طول زمان داشته باشی و انتگرالش رو بگیری، میفهمی چقدر ماشین جابجا شده.\n\nارتباط مشتق و انتگرال: انتگرال گرفتن تقریباً برعکس مشتق گرفتن است!\n\nقوانین ساده انتگرال:\n1. ∫xⁿ dx = x^(n+1)/(n+1) + C   (به شرطی که n≠-1 باشه)\n   مثلاً ∫x²dx = x³/3 + C\n   مثلاً ∫x dx = x²/2 + C\n\n2. ∫k·f(x)dx = k·∫f(x)dx  (ضریب ثابت بیرون میاد)\n\nC چیه؟ چون مشتق عدد ثابت صفر بود، وقتی انتگرال می‌گیریم یه عدد نامعلوم داریم که بهش ثابت انتگرال می‌گن.\n\n🎯 مثال عددی:\n∫(2x+3)dx = 2·x²/2 + 3x + C = x² + 3x + C\n\nبرای اینکه چک کنه: مشتق x²+3x+C میشه 2x+3، درسته؟"}, {"title": "اولین معادله دیفرانسیل", "body": "خب تا اینجا مشتق و انتگرل رو دیدی.\nمعادله دیفرانسیل یعنی چی؟ یعنی معادله‌ای که توش مشتق تابع هم باشه.\n\nساده‌ترین نوع: جداشدنی\nمثال: dy/dx = 2x\n\nمی‌خوایم بفهمیم خود تابع y بر حسب x چیه.\nراهش ساده: انتگرال از دو طرف!\ndy = 2x dx\n∫dy = ∫2x dx\ny = x² + C\n\n✅ همین!\nحالا اگه بگن شرط اولیه y(0)=3 داریم یعنی وقتی x=0 مقدار y=3 است:\ny(0)=0+C=3 → C=3 → جواب نهایی: y=x²+3\n\n🔹 تبریک! الان اولین معادله دیفرانسیل رو بلدی حل کنی!\nدر درس‌های بعدی این رو عمیق‌تر می‌کنیم."}]}, {"name": "سطح ۲ — متوسط", "lessons": [{"title": "معادلات مرتبه اول کامل", "body": "انواع معادلات دیفرانسیل مرتبه اول:\n۱. جداشدنی (که بلدی)\n۲. خطی (الان یاد می‌گیری)\n۳. همگن و برنولی\n\n🔹 معادله خطی مرتبه اول:\ny' + P(x)y = Q(x)\n\nراهش از «عامل انتگرال‌ساز» می‌گذره:\nμ(x) = e^(∫P(x)dx)\n\nوقتی در معادله ضرب می‌کنیم:\nd/dx(μ·y) = μ·Q(x)\nسپس انتگرال می‌گیریم:\nμ·y = ∫μ·Q dx + C\ny = (∫μQ dx + C)/μ\n\n🎯 مثال: y'+2y=e^(-x)\nP(x)=2, Q(x)=e^(-x)\nμ=e^(∫2dx)=e^(2x)\ny·e^(2x) = ∫e^(2x)·e^(-x)dx = ∫e^x dx = e^x + C\ny = e^(-x) + C·e^(-2x) ✅"}, {"title": "آمار و احتمال — اصول اولیه", "body": "احتمال چیه؟ عددی بین صفر و یک که نشان می‌دهد یک پیشامد چقدر احتمال وقوع دارد.\n• احتمال ۰ یعنی هیچ‌وقت اتفاق نمی‌افته\n• احتمال ۱ یعنی حتماً اتفاق می‌افته\n• ۰.۵ یعنی ۵۰-۵۰ (مثل شیر یا خط)\n\nقاعده جمع: P(A∪B) = P(A)+P(B) - P(A∩B)\nاحتمال شرطی: P(A|B) = P(A∩B)/P(B)\nاگر A و B مستقل باشند: P(A∩B)=P(A)·P(B)\n\nقضیه بیز (مثل پزشکی):\nP(بیمار|مثبت) = P(مثبت|بیمار)·P(بیمار)/P(مثبت)\n\nمثال: یه تست بیماری دقت ۹۵% دارد. بیماری در ۱% مردم هست.\nاگه کسی تستش مثبت شد، واقعاً بیماره؟\nجایگذاری در بیز: احتمال واقعی خیلی کمتر از چیزی که فکر می‌کنی میشه! (حدود ۱۶%).\nبهش «پارادوکس دقت تست» میگن."}]}, {"name": "سطح ۳ — پیشرفته (کنکور)", "lessons": [{"title": "آمادگی کنکور ریاضی", "body": "در این سطح که تسلط متوسط داشتی، باید:\n• در کمتر از ۱.۵ دقیقه هر سوال ODE رو حل کنی\n• بتونی مسائل بیز و ترکیبیات رو به سرعت بزنی\n• فوریه و لاپلاس رو برعکس هم بلد باشی\n• سری فوریه و مانده رو مسلط باشی\n\n💡 ترفندهای کنکوری رو در درس‌نامه اصلی و سوالات کامل دیدی.\nپیشنهاد: روزی ۱۰ سوال ریاضی از بانک سوال بزن، و حتماً اشتباهاتت رو مرور کن."}]}]}, "physics": {"title": "فیزیک از صفر", "levels": [{"name": "سطح ۱ — پایه", "lessons": [{"title": "الکتریسیته ساده: ولت، آمپر، مقاومت", "body": "بیا با هم الکتریسیته رو از صفر یاد بگیریم. اینجا هیچ اصطلاح سختی نمی‌خوایم استفاده کنم.\n\n🔹 تشبیه آب (همیشه این تشبیه رو به خاطر بسپار):\n• سیم = لوله آب\n• جریان الکتریکی (I) = مقدار آبی که در لوله در ثانیه عبور می‌کنه (واحدش آمپر A)\n• ولتاژ (V) = فشار پمپ آب (واحدش ولت V)\n• مقاومت (R) = باریک بودن لوله (واحدش اهم Ω)\n\nقانون اهم (مهم‌ترین فرمول الکتریسیته):\nV = I × R\n\nیعنی: فشار = جریان × باریکی لوله\n\nمثال: اگه ولتاژ باتری ۱۰ ولت باشه و مقاومت ۵ اهم، چقدر جریان رد میشه؟\nI = V/R = 10/5 = 2 آمپر ✅\n\n🔹 خازن چیه؟ مثل یه مخزن آب که می‌تونه آب (بار الکتریکی) ذخیره کنه.\n🔹 سلف چیه؟ مثل چرخ آبی که در برابر تغییرات ناگهانی جریان مقاومت می‌کنه."}, {"title": "موج چیه؟", "body": "موج یعنی یک اختلال که منتقل می‌شه (بدون انتقال واقعی ماده).\nمثل موج روی آب — موج حرکت می‌کنه ولی قطرات آب فقط بالا پایین می‌رن.\n\nطول موج (λ): فاصله بین دو قله متوالی\nفرکانس (f): چند تا موج در یک ثانیه رد می‌شه\nسرعت موج (v) = λ × f\n\nمثال: امواج رادیو با فرکانس ۱۰۰ مگاهرتز (رادیو اف‌ام ۱۰۰)\nچون c=3×10⁸ m/s (سرعت نور)، پس:\nλ=c/f = 3e8 / 1e8 = 3 متر\nیعنی طول موج رادیو FM حدود ۳ متره!\n\nانواع موج:\n• عرضی (مثل طناب، نور)\n• طولی (مثل صوت، اولتراسوند)\n• امواج مکانیکی نیاز به محیط دارن (صوت در هوا)\n• امواج الکترومغناطیس در خلأ هم حرکت می‌کنن (نور، رادیو، X-ray)"}]}, {"name": "سطح ۲ — متوسط", "lessons": [{"title": "مدار RC و RL", "body": "وقتی مقاومت و خازن با هم در مدار باشن:\n• خازن آرام‌آرام شارژ/دشارژ میشه\n• ثابت زمانی τ = RC (تایم کنستانت)\nیعنی بعد از یک τ حدود ۶۳% خازن شارژ شده. بعد از ۵τ تقریباً کامل.\n\nکاربرد در پزشکی:\nفیلترها در دستگاه ECG/EEG همگی RC هستن!\nهمچنین پالس‌اکسی‌متر و تقویت‌کننده‌های بیوپتانسیل از RC استفاده می‌کنن."}]}, {"name": "سطح ۳ — پیشرفته (کنکور)", "lessons": [{"title": "نوسان و پرتو", "body": "حالا که پایه و متوسط رو بلدی، برای کنکور باید:\n• مدار تشدید RLC، فرکانس قطع فیلتر\n• اثر دوپلر (مثلاً در اولتراسوند داپلر جریان خون)\n• جذب پرتو I=I₀e^(-μx) و کاربردش در تصویربرداری\n• پرتوزایی و نیم‌عفر\n\nتمرین کن سوالات فیزیک بانک رو بزنی."}]}]}, "circuits": {"title": "مدار الکتریکی از صفر", "levels": [{"name": "سطح ۱ — پایه", "lessons": [{"title": "مدار سری و موازی", "body": "دو تا روش اتصال مقاومت داریم: سری و موازی.\n\n🔹 اتصال سری (پشت سر هم):\nمثل وقتی یه دونه لوله باریک پشت یه دیگه باریک بزنی — مقاومت بیشتر میشه.\nR_eq = R₁ + R₂ + R₃ + ...\nجریان در همه‌شون یکسان است.\n\n🔹 اتصال موازی (دوشاخه):\nمثل اینکه لوله‌ای رو دو شاخه کنی — راه بیشتر برای عبور جریان، مقاومت کم میشه.\n1/R_eq = 1/R₁ + 1/R₂ + 1/R₃ + ...\nولتاژ دو سر همه‌شون یکسان است.\n\nمثال: دو مقاومت ۲ اهم و ۲ اهم:\n• سری: R=4 اهم\n• موازی: R=1 اهم (کمتر از هر کدام!)"}, {"title": "آپ‌اَمپ چیه؟", "body": "تقویت‌کننده عملیاتی (Op-Amp) یه قطعه الکترونیکیه که خیلی کارش درسته!\nکارش چیه؟ یه ورودی کوچک رو می‌گیره و تقویت می‌کنه.\n\nقواعد آپ‌اَمپ ایده‌آل (خیلی ساده):\n1. ولتاژ دو پایه ورودی همیشه با هم برابر هست (V⁺ = V⁻)\n2. هیچ جریانی از پایه‌های ورودی وارد نمی‌شه\n\nدو مدار اصلی:\n🔹 وارون (معکوس‌کننده): ورودی به پایه منفی وصل میشه\n   V_out = -(R_f/R_in)·V_in\n🔹 ناوارون: ورودی به پایه مثبت\n   V_out = (1+R_f/R_in)·V_in\n\nمثال: R_in=1kΩ, R_f=10kΩ\nوارون: V_out = -10·V_in\nناوارون: V_out = 11·V_in\n\n📌 کاربرد پزشکی: از آپ‌اَمپ برای تقویت سیگنال‌های کوچک قلب و مغز (ECG, EEG) که هزارم ولت هستن استفاده می‌کنیم!"}]}, {"name": "سطح ۲ — متوسط", "lessons": [{"title": "فیلترها برای دستگاه پزشکی", "body": "فیلتر RC یعنی چی؟ با ترکیب R و C می‌تونیم بذاریم بعضی فرکانس‌ها از مسیر رد بشن و بقیه حذف بشن.\n\nفیلتر پایین‌گذر (LPF): فرکانس پایین رد، بالا قطع\n→ برای حذف نویز فرکانس بالا\nفیلتر بالاگذر (HPF): فرکانس بالا رد، پایین قطع\n→ برای حذف تغییرات آهسته خط پایه ECG\nفیلتر ناچ (Notch): فقط فرکانس مشخصی (مثل ۵۰هرتز برق شهر) رو حذف می‌کنه\n\nفرکانس قطع ساده RC: f_c = 1/(2πRC)"}]}, {"name": "سطح ۳ — پیشرفته (کنکور)", "lessons": [{"title": "آمادگی کنکور مدار", "body": "باید بتونی در کمتر از ۲ دقیقه هر سوال مدار رو حل کنی:\n• تونن و نورتن به سرعت\n• ضریب قدرت در سه‌فاز\n• آپ‌اَمپ ترکیبی\n• انتقال توان ماکزیمم"}]}]}, "anatomy": {"title": "آناتومی و فیزیولوژی از صفر", "levels": [{"name": "سطح ۱ — پایه", "lessons": [{"title": "قلب چطور کار می‌کنه؟", "body": "قبل از هر چیزی باید بدونی قلب چیه و چطور می‌زنه.\nقلب یه تلمبه عضلانی به اندازه مشت دست تو!\nچهار تا حفره داره:\n- دو تا دهلیز (بالاها)\n- دو تا بطن (پایین‌ها)\n\nچرا دائماً می‌زنه؟ توی دیواره قلب یک «ساعت طبیعی» وجود داره به اسم گره SA (سینوسی).\nهر ثانیه یک بار (یا دقیقش ۶۰ تا ۱۰۰ بار در دقیقه) یک پالس الکتریکی تولید می‌کنه که باعث انقباض قلب میشه.\n\nمسیر پالس الکتریکی:\nگره SA → دهلیزها منقبض می‌شن (خون به بطن) → گره AV → فیبرهای پورکنژ → بطن‌ها منقبض میشن (خون به ریه و بدن)\n\nاین پالس الکتریکی از روی پوست هم با دستگاه ECG قابل اندازه‌گیریه!"}, {"title": "نوار قلب (ECG) چی رو نشون میده؟", "body": "اگه از قلب با دستگاه ECG نوار بگیری، چند تا موج می‌بینی:\n\n🔹 موج P: دهلیزها منقبض می‌شن (دپولاریزاسیون دهلیز)\n🔹 مجموعه QRS: بطن‌ها منقبض می‌شن (بزرگترین موج چون بطن عضله بیشتری داره)\n🔹 موج T: بطن‌ها دوباره استراحت می‌ک <script>/* =====================================================
   BME MSc Konkur Prep — Web UI v2
   Features: subject-sorted random quiz, green/red instant feedback,
   konkori trick + full solution, save for review, teacher mode,
   free books, saved questions
===================================================== */
const LS_KEY = "bme_konkur_progress_v2";

const STATE = {
  progress: loadProgress(),
  view: "dashboard",
  activeSubject: null,
  quiz: null,
  exam: null,
  teacher: null,    // {subject, slideIdx}
  timerHandle: null,
};

function loadProgress(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return {
    bookmarks:[],
    saved_questions:[],   // سوالاتی که ذخیره کرده برای مرور
    completed_lessons:[],
    quiz_stats:{correct:0,total:0},
    exam_results:[],
    theme:"dark"
  };
}
function saveProgress(){ localStorage.setItem(LS_KEY, JSON.stringify(STATE.progress)); updateSidebarStat(); }

const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function subColor(id){const s=APP_DATA.subjects.find(x=>x.id===id);return s?s.color:"#38bdf8";}
function subName(id){const s=APP_DATA.subjects.find(x=>x.id===id);return s?s.name:"";}
function subEmoji(id){const s=APP_DATA.subjects.find(x=>x.id===id);return s?s.emoji:"📘";}
function letterOf(i){return ["الف","ب","ج","د"][i]||"?";}

function updateSidebarStat(){
  const s=STATE.progress.quiz_stats;
  const acc = s.total?Math.round(s.correct*100/s.total):0;
  const saved = (STATE.progress.saved_questions||[]).length;
  const el = document.getElementById("sidebar-stat-body");
  if(el) el.innerHTML = `سوالات پاسخ‌داده: <b>${s.total}</b><br>درست: <b style="color:var(--success)">${s.correct}</b> (${acc}%)<br>سوالات ذخیره: <b style="color:var(--warning)">${saved}</b>`;
}

/* ---- nav ---- */
function setView(v){
  STATE.view = v;
  $$(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===v));
  render();
  document.getElementById("main").scrollTop=0;
}

/* ---- دکمه بازگشت سیستم (اندروید/دسکتاپ) ----
   اگر داخل صفحه‌ای بودیم که باید اول برگرده، true برمی‌گرداند */
function appBack(){
  const v = STATE.view;
  // اگر منویی بازه، اول اون بسته بشه
  const openModal = document.querySelector(".modal-backdrop");
  if(openModal){ openModal.remove(); return true; }
  const map = {
    "subject-detail":"subjects",
    "teacher-lesson":"teacher",
    "foundation-lesson":"foundation",
    "quiz-playing":"quiz",
    "quiz-result":"quiz",
    "exam-playing":"exams",
    "exam-result":"exams",
    "practice-playing":"practice",
    "practice-result":"practice",
    "savedq":"dashboard",
    "bookmarks":"dashboard",
    "freebooks":"dashboard"
  };
  if(map[v]){
    if(STATE.timerHandle){clearInterval(STATE.timerHandle);STATE.timerHandle=null;}
    setView(map[v]);
    return true;
  }
  return false;  // در صفحه اصلی => خروج
}
window.appBack = appBack;

/* ---- تشخیص پلتفرم بومی ---- */
const IS_NATIVE = !!(window.Android || window.pywebview);

function render(){
  const main = $("#main");
  main.classList.remove("fade"); void main.offsetWidth; main.classList.add("fade");
  const v=STATE.view;
  if(v==="dashboard") renderDashboard(main);
  else if(v==="subjects") renderSubjects(main);
  else if(v==="subject-detail") renderSubjectDetail(main);
  else if(v==="quiz") renderQuizHome(main);
  else if(v==="quiz-playing") renderQuiz(main);
  else if(v==="quiz-result") renderQuizResult(main);
  else if(v==="exams") renderExamsHome(main);
  else if(v==="exam-playing") renderExam(main);
  else if(v==="exam-result") renderExamResult(main);
  else if(v==="books") renderBooks(main);
  else if(v==="freebooks") renderFreeBooks(main);
  else if(v==="bookmarks") renderBookmarks(main);
  else if(v==="savedq") renderSavedQuestions(main);
  else if(v==="teacher") renderTeacherHome(main);
  else if(v==="teacher-lesson") renderTeacherLesson(main);
  else if(v==="foundation") renderFoundationHome(main);
  else if(v==="foundation-lesson") renderFoundationLesson(main);
  else if(v==="practice") renderPracticeHome(main);
  else if(v==="practice-playing") renderPracticeQuiz(main);
  else if(v==="practice-result") renderPracticeResult(main);
  else if(v==="settings") renderSettings(main);
  updateSidebarStat();
}

/* -------- Dashboard -------- */
function renderDashboard(main){
  const totalLessons = APP_DATA.subjects.reduce((a,s)=>a+s.lessons.length,0);
  const totalQ = APP_DATA.all_pool.length;
  const s=STATE.progress.quiz_stats;
  const acc = s.total?Math.round(s.correct*100/s.total):0;
  const last = STATE.progress.exam_results.slice(-1)[0];
  main.innerHTML = `
    <div class="page-head"><h1>سلام! خوش اومدی 👋</h1>
    <p>مطالعه درس‌نامه، تست ترکیبی شافل مبحثی، آزمون‌های ۱۰ ساله، و تدریس خصوصی با استاد 🧑‍🏫</p></div>
    <div class="big-stats">
      <div class="big-stat"><div class="num" style="color:var(--accent)">${totalLessons}</div><div class="lbl">فصل درس‌نامه 📖</div></div>
      <div class="big-stat"><div class="num" style="color:var(--accent2)">${totalQ}</div><div class="lbl">سوال تستی 📝</div></div>
      <div class="big-stat"><div class="num" style="color:var(--success)">${acc}%</div><div class="lbl">درصد صحیح ✅</div></div>
    </div>
    <div class="section-title">🚀 شروع سریع</div>
    <div class="grid-cards">
      <div class="card clickable" onclick="setView('foundation')"><div class="emoji">🎒</div><h3>دوره پایه تا پیشرفته</h3><p>از صفرِ صفر درس بخون، انگار هیچی بلد نیستی، برو تا سطح کنکور</p>
        <div class="card-actions"><button class="btn btn-primary" style="background:var(--warning);color:#0f172a">شروع از پایه</button></div></div>
      <div class="card clickable" onclick="startMixedQuiz()"><div class="emoji">🎲</div><h3>تست ترکیبی مبحثی شافل</h3><p>۲۰ سوال مبحث‌به‌مبحث از سال‌های مختلف، هر بار جدید</p>
        <div class="card-actions"><button class="btn btn-primary">شروع تست تمرینی</button></div></div>
      <div class="card clickable" onclick="setView('practice')"><div class="emoji">✏️</div><h3>سوالات تمرینی تالیفی</h3><p>آموزش قبل از جواب + جواب تشریحی، مبحث به مبحث</p>
        <div class="card-actions"><button class="btn btn-success">شروع تمرین</button></div></div>
      <div class="card clickable" onclick="startExam(${APP_DATA.exams.length-1})"><div class="emoji">🎓</div><h3>آزمون سال اخیر</h3><p>۶۰ دقیقه، ۲۵ سوال با تایمر</p>
        <div class="card-actions"><button class="btn btn-secondary">آزمون جامع</button></div></div>
      <div class="card clickable" onclick="setView('teacher')"><div class="emoji">🧑‍🏫</div><h3>کلاس با استاد</h3><p>تدریس تعاملی درس به درس</p>
        <div class="card-actions"><button class="btn" style="background:var(--warning);color:#0f172a">شروع کلاس</button></div></div>
      <div class="card clickable" onclick="setView('freebooks')"><div class="emoji">🔗</div><h3>کتاب‌های رایگان</h3><p>لینک منابع آزاد قانونی برای مطالعه عمیق</p>
        <div class="card-actions"><button class="btn btn-ghost">مشاهده</button></div></div>
    </div>
    <div class="section-title">📚 دروس</div>
    <div class="grid-cards" id="subjects-grid"></div>
    <div class="section-title">⭐ دسترسی سریع</div>
    <div class="grid-cards">
      <div class="card clickable" onclick="setView('savedq')"><div class="emoji">💾</div><h3>سوالات ذخیره‌شده (${(STATE.progress.saved_questions||[]).length})</h3><p>سوالات مهمی که ذخیره کردی برای مرور</p></div>
      <div class="card clickable" onclick="setView('freebooks')"><div class="emoji">🔗</div><h3>کتاب‌های رایگان</h3><p>لینک‌های قانونی و آزاد منابع درسی</p></div>
      <div class="card clickable" onclick="setView('books')"><div class="emoji">📖</div><h3>کتاب‌های مرجع</h3><p>معرفی ۲۰ کتاب اصلی کنکور</p></div>
    </div>
    ${last?`<div class="section-title">🏅 آخرین آزمون</div>
      <div class="card"><div style="font-weight:700;font-size:18px;color:var(--warning)">دوره ${last.year} — ${last.score} از ${last.total} (${Math.round(last.score*100/last.total)}%) <span style="font-size:12px;color:var(--muted)">${last.date||""}</span></div></div>`:""}
  `;
  const g=$("#subjects-grid");
  APP_DATA.subjects.forEach(s=>{
    const qc=(APP_DATA.question_bank[s.id]||[]).length;
    const lc=s.lessons.length;
    const el=document.createElement("div");el.className="card clickable";
    el.innerHTML=`<div class="emoji">${s.emoji}</div><h3>${s.name}</h3><p>${lc} فصل • ${qc} سوال</p>
      <div class="card-actions">
        <button class="btn btn-sm btn-primary" data-act="study">📖 مطالعه</button>
        <button class="btn btn-sm btn-secondary" data-act="quiz">📝 تست</button>
        <button class="btn btn-sm" data-act="teacher" style="background:var(--warning);color:#0f172a">🧑‍🏫 استاد</button>
      </div>`;
    el.querySelector("h3").style.color=s.color;
    el.addEventListener("click",e=>{
      const act=e.target.dataset.act;
      if(act==="quiz") startQuiz(s.id);
      else if(act==="teacher") openTeacher(s.id);
      else openSubject(s.id);
    });
    g.appendChild(el);
  });
}

/* ---- Subjects ---- */
function renderSubjects(main){
  main.innerHTML=`<div class="page-head"><h1>📚 دروس و سرفصل‌ها</h1><p>یک درس را انتخاب کن</p></div><div class="grid-cards" id="g"></div>`;

/* تست ترکیبی مبحثی:
   سوالات را به تفکیک مبحث گروه می‌کند، داخل هر مبحث شافل می‌کرد، سپس به صورت مبحث‌به‌مبحث (نه درهم) پشت سر هم می‌گذارد.
   هر بار اجرا کاملاً شافل جدید.
*/
function startMixedQuiz(){
  // گروه‌بندی بر اساس subject
  const groups = {};
  APP_DATA.all_pool.forEach(q=>{
    if(!groups[q.subject]) groups[q.subject]=[];
    groups[q.subject].push({...q});
  });
  // داخل هر گروه شافل و چندتایی برمی‌داریم
  let pick=[];
  Object.keys(groups).forEach(sid=>{
    groups[sid] = shuffle(groups[sid]);
    pick = pick.concat(groups[sid].slice(0,2)); // 2 سوال از هر درس = 20 سوال
  });
  // مرتب‌سازی مبحث به مبحث (همه از یک درس کنار هم)، اما ترتیب مباحث را هم شافل می‌کنیم
  // در بالا ترتیب دروس مطابق SUBJECTS است. برای اینکه درس‌ها هم شافل شوند ولی داخل هر درس پیوسته باشد:
  // ابتدا آرایه دروس را شافل می‌کنیم، سپس بر اساس آن pick را بازچینی:
  const subject_ids = shuffle(APP_DATA.subjects.map(s=>s.id));
  const ordered = [];
  subject_ids.forEach(sid=>{
    ordered.push(...pick.filter(q=>q.subject===sid));
  });
  STATE.quiz = {questions:ordered.slice(0,20), idx:0, correct:0, subject:"ترکیبی مبحثی (شافل شده)"};
  setView("quiz-playing");
}
function startQuiz(sid){
  const qs=(APP_DATA.question_bank[sid]||[]).map(q=>({...q,subject:sid}));
  const questions=shuffle(qs).slice(0,Math.min(qs.length,20));
  const subj=APP_DATA.subjects.find(s=>s.id===sid);
  STATE.quiz={questions,idx:0,correct:0,subject:subj?subj.name:""};
  setView("quiz-playing");
}

function renderQuiz(main){
  const Q=STATE.quiz;if(!Q){setView("quiz");return;}
  if(Q.idx>=Q.questions.length){renderQuizResult(main);return;}
  const q=Q.questions[Q.idx];
  const pct=(Q.idx/Q.questions.length)*100;
  const isSaved = (STATE.progress.saved_questions||[]).some(x=>x.q===q.q && x.subject===q.subject);
  main.innerHTML=`
    <div class="quiz-wrap">
      <div class="quiz-meta">
        <div>سوال <b>${Q.idx+1}</b> از ${Q.questions.length} — <span style="color:${subColor(q.subject)}">${subEmoji(q.subject)} ${subName(q.subject)}</span>${q.year?` <span style="color:var(--muted);font-size:12px">• کنکور ${q.year}</span>`:""}</div>
        <div>درست: <b style="color:var(--success)">${Q.correct}</b></div>
      </div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="q-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div class="q-text" style="flex:1">${q.q}</div>
          <button class="btn btn-sm ${isSaved?'btn-primary':'btn-ghost'}" id="saveBtn" title="ذخیره برای مرور">${isSaved?'💾 ذخیره شد':'💾 ذخیره'}</button>
        </div>
        <div id="choices">
          ${q.choices.map((c,i)=>`<div class="choice" data-i="${i}"><div class="letter">${letterOf(i)}</div><div>${c}</div></div>`).join("")}
        </div>
        <div class="explain" id="explain" style="display:none"></div>
        <div class="q-actions">
          <button class="btn btn-ghost" onclick="setView('quiz')">🔙 انصراف</button>
          <div style="display:flex;gap:8px">
            <button class="btn btn-success" id="checkBtn" onclick="checkAnswer()">✅ ثبت پاسخ</button>
            <button class="btn btn-primary" id="nextBtn" style="display:none" onclick="nextQuestion()">بعدی ➡️</button>
          </div>
        </div>
      </div>
    </div>`;
  $$("#choices .choice").forEach(c=>c.onclick=()=>{
    if($("#checkBtn").disabled) return;
    $$("#choices .choice").forEach(x=>x.classList.remove("selected"));
    c.classList.add("selected");
  });
  $("#saveBtn").onclick=()=>{
    const saved = STATE.progress.saved_questions||(STATE.progress.saved_questions=[]);
    const exists = saved.findIndex(x=>x.q===q.q && x.subject===q.subject);
    if(exists>=0){ saved.splice(exists,1); $("#saveBtn").textContent="💾 ذخیره"; $("#saveBtn").classList.remove("btn-primary"); $("#saveBtn").classList.add("btn-ghost");}
    else{ saved.push({...q}); $("#saveBtn").textContent="💾 ذخیره شد"; $("#saveBtn").classList.add("btn-primary"); $("#saveBtn").classList.remove("btn-ghost");}
    saveProgress();
  };
}
function checkAnswer(){
  const Q=STATE.quiz;const q=Q.questions[Q.idx];
  const chosenEl=document.querySelector("#choices .choice.selected");
  if(!chosenEl){alert("لطفاً یک گزینه را انتخاب کن");return;}
  const chosen=parseInt(chosenEl.dataset.i);
  STATE.progress.quiz_stats.total++;
  $$("#choices .choice").forEach(c=>{
    const idx=parseInt(c.dataset.i);
    if(idx===q.answer) c.classList.add("correct");
    if(idx===chosen && chosen!==q.answer) c.classList.add("wrong");
    c.style.pointerEvents="none";
  });
  const ex=$("#explain");
  const correct_letter = letterOf(q.answer);
  const konkori = q.konkori||"";
  const full_sol = q.full_solution||"";
  if(chosen===q.answer){
    Q.correct++;STATE.progress.quiz_stats.correct++;
    ex.innerHTML = `<div style="color:var(--success);font-weight:700;margin-bottom:8px">✅ پاسخ صحیح بود!</div>
      <div style="background:rgba(245,158,11,.1);padding:8px;border-radius:8px;margin-bottom:8px"><b style="color:var(--warning)">🎯 راه حل کنکوری:</b><br>${konkori}</div>
      <div style="background:rgba(56,189,248,.08);padding:8px;border-radius:8px"><b style="color:var(--accent)">📚 توضیح کامل:</b><br>${full_sol}</div>`;
    ex.style.borderColor="var(--success)";
    ex.style.background="rgba(34,197,94,.10)";
  } else {
    ex.innerHTML = `<div style="color:var(--danger);font-weight:700;margin-bottom:8px">❌ پاسخ اشتباه! گزینه صحیح <b>${correct_letter}</b> بود.</div>
      <div style="background:rgba(245,158,11,.1);padding:8px;border-radius:8px;margin-bottom:8px"><b style="color:var(--warning)">🎯 راه حل کنکوری:</b><br>${konkori}</div>
      <div style="background:rgba(56,189,248,.08);padding:8px;border-radius:8px"><b style="color:var(--accent)">📚 توضیح کامل:</b><br>${full_sol}</div>`;
    ex.style.borderColor="var(--danger)";
    ex.style.background="rgba(239,68,68,.10)";
  }
  ex.style.display="block";
  $("#checkBtn").disabled=true;$("#checkBtn").style.opacity=.4;
  $("#nextBtn").style.display="inline-block";
  saveProgress();
}
function nextQuestion(){STATE.quiz.idx++;render();}

function startExam(i){
  const exam=APP_DATA.exams[i];
  STATE.exam={idx:0,correct:0,year:exam.year,title:exam.title,
    questions:exam.questions,answers:Array(exam.questions.length).fill(-1),
    remaining:60*60,startTs:Date.now(),submitted:false};
  setView("exam-playing");startExamTimer();
}
function startExamTimer(){
  if(STATE.timerHandle){clearInterval(STATE.timerHandle);}
  STATE.timerHandle=setInterval(()=>{
    if(STATE.view!=="exam-playing"||!STATE.exam||STATE.exam.submitted){clearInterval(STATE.timerHandle);return;}
    STATE.exam.remaining--;
    if(STATE.exam.remaining<=0){clearInterval(STATE.timerHandle);submitExam(true);return;}
    const t=$("#ex-timer");if(!t)return;
    const m=Math.floor(STATE.exam.remaining/60),s=STATE.exam.remaining%60;
    t.textContent=`⏱️  ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}
function renderExam(main){
  const E=STATE.exam;if(!E){setView("exams");return;}
  const q=E.questions[E.idx];const pct=((E.idx+1)/E.questions.length)*100;
  const answered=E.answers.filter(a=>a!==-1).length;
  main.innerHTML=`<div class="quiz-wrap">
    <div class="quiz-meta"><div>دوره ${E.year} • سوال <b>${E.idx+1}</b> از ${E.questions.length}</div><div class="timer" id="ex-timer"></div></div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%;background:linear-gradient(90deg,var(--accent2),var(--warning))"></div></div>
    <div class="q-nav" id="qnav">${E.questions.map((_,qi)=>{
      const ans=E.answers[qi];const cls=qi===E.idx?"active":(ans!==-1?"answered":"");
      return `<button class="${cls}" data-jump="${qi}">${qi+1}</button>`;}).join("")}</div>
    <div class="q-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div class="q-text" style="flex:1">${q.q}</div>

      <div class="q-actions">
        <button class="btn btn-danger" onclick="submitExam(false)">پایان آزمون</button>

          ${E.idx>0?'<button class="btn btn-ghost" onclick="jumpQ('+(E.idx-1)+')">⬅️ قبلی</button>':""}
          ${E.idx<E.questions.length-1?'<button class="btn btn-secondary" onclick="saveAndNext()">ذخیره و بعدی ➡️</button>':'<button class="btn btn-success" onclick="submitExam(false)">✅ ثبت و پایان</button>'}
        </div></div></div>
    <div style="margin-top:10px;color:var(--muted);font-size:12px">پاسخ‌داده: ${answered} از ${E.questions.length}</div></div>`;
  const m=Math.floor(E.remaining/60),s=E.remaining%60;

    else{saved.push({...q,subject:q.subject||"exam",year:E.year});$("#saveBtn").textContent="💾 ذخیره شد";}
