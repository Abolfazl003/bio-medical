plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.bmekonkur.app'
    compileSdk 34

    defaultConfig {
        applicationId "ir.bmekonkur.app"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "1.3.4"
    }

    signingConfigs {
        release {
            // در GitHub Actions این‌ها از secrets خوانده می‌شوند
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }

    // همه فایل‌های اپ داخل assets بسته‌بندی می‌شوند => کاملاً آفلاین
    // (فشرده‌سازی نمی‌شوند تا سریع‌تر لود شوند)
    androidResources {
        noCompress += ['html', 'js', 'css', 'woff2', 'svg', 'png']
    }
}

dependencies {
    // هم‌ترازی نسخه کتابخانه‌های Kotlin برای جلوگیری از تضاد کلاس‌های تکراری
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
